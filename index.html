// ---------- پوشه دانلود اختصاصی (فقط در مرورگرهایی که از File System Access پشتیبانی می‌کنند، عمدتاً کروم دسکتاپ) ----------
const FS_SUPPORTED = typeof window!=='undefined' && 'showDirectoryPicker' in window;
function idbOpen(){
  return new Promise((resolve, reject)=>{
    const req = indexedDB.open('lumeraFS', 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore('handles'); };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}
async function idbSet(key, value){
  const db = await idbOpen();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction('handles','readwrite');
    tx.objectStore('handles').put(value, key);
    tx.oncomplete = ()=> resolve();
    tx.onerror = ()=> reject(tx.error);
  });
}
async function idbGet(key){
  const db = await idbOpen();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction('handles','readonly');
    const req = tx.objectStore('handles').get(key);
    req.onsuccess = ()=> resolve(req.result || null);
    req.onerror = ()=> reject(req.error);
  });
}
let downloadDirHandle = null; // در حافظه؛ اول هر بار از IndexedDB لود می‌شود
let downloadDirName = loadJSON(STORE_KEYS.downloadDirName, '');
async function ensureDownloadDirHandle(){
  if(!FS_SUPPORTED) return null;
  if(downloadDirHandle){
    if(await downloadDirHandle.queryPermission({mode:'readwrite'}) === 'granted') return downloadDirHandle;
  }
  try{
    const stored = await idbGet('downloadDir');
    if(!stored) return null;
    const perm = await stored.queryPermission({mode:'readwrite'});
    if(perm === 'granted'){ downloadDirHandle = stored; return stored; }
    if(perm === 'prompt'){
      const req = await stored.requestPermission({mode:'readwrite'});
      if(req === 'granted'){ downloadDirHandle = stored; return stored; }
    }
  }catch(e){ /* هندل نامعتبر شده یا دسترسی لغو شده — کاربر باید دوباره پوشه را انتخاب کند */ }
  return null;
}
async function pickDownloadFolder(){
  if(!FS_SUPPORTED){ alert('این قابلیت فقط توی کروم دسکتاپ پشتیبانی می‌شه'); return; }
  try{
    const handle = await window.showDirectoryPicker();
    downloadDirHandle = handle;
    downloadDirName = handle.name;
    await idbSet('downloadDir', handle);
    saveJSON(STORE_KEYS.downloadDirName, downloadDirName);
    render();
  }catch(e){ /* کاربر انصراف داد */ }
}
function clearDownloadFolder(){
  downloadDirHandle = null;
  downloadDirName = '';
  saveJSON(STORE_KEYS.downloadDirName, '');
  idbSet('downloadDir', null).catch(()=>{});
  render();
}
// blob رو یا مستقیم توی پوشه انتخاب‌شده ذخیره می‌کنه، یا اگه پوشه‌ای تعریف نشده/پشتیبانی نمی‌شه، دانلود معمولی مرورگر رو انجام می‌ده
async function saveBlobSmart(blob, filename){
  const dir = await ensureDownloadDirHandle();
  if(dir){
    try{
      const fileHandle = await dir.getFileHandle(filename, {create:true});
      const writable = await fileHandle.createWritable();
      await writable.write(blob);
      await writable.close();
      return true;
    }catch(e){ /* اگه ذخیره مستقیم شکست خورد، برو سراغ دانلود معمولی */ }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  return false;
}
async function downloadBackup(){
  const data = { materials, products, productCategoriesList, records, invoices, invoiceSeq, customers, transactions, overheadPerUnit, overheadPercent, suppliers, purchases, manualReminders, expenses, expenseCategories, bankInfo, cheques, exportedAt: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const now = new Date();
  const stamp = todayStr() + '-' + String(now.getHours()).padStart(2,'0') + String(now.getMinutes()).padStart(2,'0') + String(now.getSeconds()).padStart(2,'0');
  const filename = 'lumera-backup-' + stamp + '.json';
  const savedDirect = await saveBlobSmart(blob, filename);
  alert(savedDirect ? ('بک‌آپ در پوشه «'+downloadDirName+'» با نام '+filename+' ذخیره شد') : ('بک‌آپ با نام '+filename+' دانلود شد'));
}

function mergeArrayById(local, incoming){
  const map = new Map();
  (local||[]).forEach(item=>{ if(item && item.id!=null) map.set(item.id, item); });
  (incoming||[]).forEach(item=>{ if(item && item.id!=null) map.set(item.id, item); }); // رکورد بک‌آپ در صورت تداخل شناسه، برنده می‌شود
  return Array.from(map.values());
}

function bindBackupEvents(){
  document.getElementById('pickFolderBtn')?.addEventListener('click', pickDownloadFolder);
  document.getElementById('clearFolderBtn')?.addEventListener('click', clearDownloadFolder);
  document.getElementById('downloadBackupBtn')?.addEventListener('click', downloadBackup);
  document.getElementById('mergeBackupBtn')?.addEventListener('click', ()=>{
    backupLoadMode = 'merge';
    document.getElementById('backupFileInput').click();
  });
  document.getElementById('replaceBackupBtn')?.addEventListener('click', ()=>{
    backupLoadMode = 'replace';
    document.getElementById('backupFileInput').click();
  });
  document.getElementById('backupFileInput')?.addEventListener('change', e=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ev=>{
      try{
        const data = JSON.parse(ev.target.result);
        const expectedKeys = ['materials','products','records','invoices','customers'];
        const isValidBackup = data && typeof data==='object' && expectedKeys.some(k=> Array.isArray(data[k]));
        if(!isValidBackup){
          alert('این فایل ساختار بک‌آپ لومرا را ندارد. لطفاً فایل JSON صحیح را انتخاب کن');
          e.target.value = '';
          return;
        }
        const itemCount = (data.invoices||[]).length + (data.customers||[]).length + (data.records||[]).length;
        const exportedAt = data.exportedAt ? jalaliStr(data.exportedAt.slice(0,10)) : 'نامشخص';

        if(backupLoadMode==='replace'){
          if(!confirm('این بک‌آپ شامل ' + itemCount + ' رکورد است (تاریخ تهیه: ' + exportedAt + '). این کار تمام اطلاعات فعلی همین دستگاه را پاک و با بک‌آپ جایگزین می‌کند — قابل بازگشت نیست. ادامه می‌دهید؟')) { e.target.value=''; return; }
          materials = data.materials || [];
          products = data.products || [];
          productCategoriesList = data.productCategoriesList || [];
          records = data.records || [];
          invoices = data.invoices || [];
          invoiceSeq = data.invoiceSeq || 2250;
          customers = data.customers || [];
          transactions = data.transactions || [];
          overheadPerUnit = data.overheadPerUnit || 0;
          overheadPercent = data.overheadPercent!=null ? data.overheadPercent : null;
          suppliers = data.suppliers || [];
          purchases = data.purchases || [];
          manualReminders = data.manualReminders || [];
          expenses = data.expenses || [];
          expenseCategories = data.expenseCategories || [];
          bankInfo = data.bankInfo || bankInfo;
          cheques = data.cheques || [];
        } else {
          if(!confirm('این بک‌آپ شامل ' + itemCount + ' رکورد است (تاریخ تهیه: ' + exportedAt + '). اطلاعات این بک‌آپ با اطلاعات فعلی همین دستگاه «ادغام» می‌شود — چیزی از این دستگاه حذف نمی‌شود. ادامه می‌دهید؟')) { e.target.value=''; return; }
          materials = mergeArrayById(materials, data.materials);
          products = mergeArrayById(products, data.products);
          productCategoriesList = mergeArrayById(productCategoriesList, data.productCategoriesList);
          records = mergeArrayById(records, data.records);
          invoices = mergeArrayById(invoices, data.invoices);
          invoiceSeq = Math.max(invoiceSeq, data.invoiceSeq || 0);
          customers = mergeArrayById(customers, data.customers);
          transactions = mergeArrayById(transactions, data.transactions);
          suppliers = mergeArrayById(suppliers, data.suppliers);
          purchases = mergeArrayById(purchases, data.purchases);
          manualReminders = mergeArrayById(manualReminders, data.manualReminders);
          expenses = mergeArrayById(expenses, data.expenses);
          expenseCategories = mergeArrayById(expenseCategories, data.expenseCategories);
          cheques = mergeArrayById(cheques, data.cheques);
          // تنظیمات سراسری (سربار، اطلاعات واریز) دست نمی‌خورند مگر این دستگاه هنوز مقداری نداشته باشد
          if(!overheadPerUnit) overheadPerUnit = data.overheadPerUnit || overheadPerUnit;
          if(overheadPercent==null) overheadPercent = data.overheadPercent!=null ? data.overheadPercent : overheadPercent;
          if(data.bankInfo && !bankInfo.cardNumber && !bankInfo.iban) bankInfo = data.bankInfo;
        }

        saveJSON(STORE_KEYS.materials, materials);
        saveJSON(STORE_KEYS.products, products);
        saveJSON(STORE_KEYS.productCategories, productCategoriesList);
        saveJSON(STORE_KEYS.records, records);
        saveJSON(STORE_KEYS.invoices, invoices);
        saveJSON(STORE_KEYS.invoiceSeq, invoiceSeq);
        saveJSON(STORE_KEYS.customers, customers);
        saveJSON(STORE_KEYS.transactions, transactions);
        saveJSON(STORE_KEYS.overheadPerUnit, overheadPerUnit);
        saveJSON(STORE_KEYS.overheadPercent, overheadPercent);
        saveJSON(STORE_KEYS.suppliers, suppliers);
        saveJSON(STORE_KEYS.purchases, purchases);
        saveJSON(STORE_KEYS.reminders, manualReminders);
        saveJSON(STORE_KEYS.expenses, expenses);
        saveJSON(STORE_KEYS.expenseCategories, expenseCategories);
        saveJSON(STORE_KEYS.bankInfo, bankInfo);
        saveJSON(STORE_KEYS.cheques, cheques);
        alert(backupLoadMode==='replace' ? 'بک‌آپ با موفقیت جایگزین شد' : 'بک‌آپ با موفقیت ادغام شد');
        render();
      }catch(err){
        alert('فایل بک‌آپ معتبر نیست');
      }
      e.target.value = '';
    };
    reader.readAsText(file);
  });
}

render();
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{ /* بدون بارگذار خدمتگر هم برنامه به شکل عادی کار می‌کند */ });
  });
}

    --c-ink:#2F3338;             /* Graphite — primary text, 30% weight */
    --c-ink-soft:#565B60;        /* lighter Graphite tint — secondary text */
    --c-steel:#6B7075;           /* mid Graphite tint — muted/secondary UI elements */
    --c-steel-light:#9CA0A4;     /* light Graphite tint — disabled/faint elements */
    --c-line:#E4E5E8;            /* hairline divider */
    --c-line-soft:#EDEEF0;
    --c-accent:#E61E32;          /* LUMERA Red — accent only, 10% weight, never dominant */
    --c-accent-soft:#FDECEE;
    --c-success:#1A7A3A;
    --c-success-soft:#EAF7EE;
    --c-black:#000000;           /* used sparingly per brand rule */
    --c-white:#FFFFFF;

    /* ---- Typography tokens ---- */
    --font-fa:'Vazirmatn','Inter',Tahoma,Arial,sans-serif;
    --fs-h1:21px; --fs-sub:13px; --fs-body:13.5px; --fs-label:12px; --fs-caption:11px; --fs-micro:9.5px;
    --fw-regular:400; --fw-medium:500; --fw-bold:700; --fw-black:800;
    --lh-tight:1.25; --lh-normal:1.5; --lh-loose:1.7;

    /* ---- Radius scale ---- */
    --r-sm:8px; --r-md:12px; --r-lg:16px; --r-pill:999px;

    /* ---- Elevation (neomorphic dual-tone) ---- */
    --sh-raised:6px 6px 14px rgba(20,22,24,0.09), -6px -6px 14px rgba(255,255,255,0.85);
    --sh-raised-sm:3px 3px 8px rgba(20,22,24,0.08), -3px -3px 8px rgba(255,255,255,0.8);
    --sh-inset:inset 3px 3px 7px rgba(20,22,24,0.10), inset -3px -3px 7px rgba(255,255,255,0.75);
    --sh-flat:0 1px 3px rgba(20,22,24,0.06);
    --sh-elevated:0 10px 30px rgba(15,17,20,0.09);

    /* ---- Spacing scale ---- */
    --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px; --sp-8:32px;

    /* ---- Transition system ---- */
    --ease:cubic-bezier(.4,0,.2,1);
    --t-fast:0.15s; --t-med:0.25s;

    /* ---- Z-index scale ---- */
    --z-sticky:10; --z-modal:100;

    /* legacy names kept in case referenced elsewhere in the file */
    --red:var(--c-accent);
    --gray:var(--c-steel);
  }

  *{box-sizing:border-box;}
  button:focus-visible,.tab-btn:focus-visible,.pill:focus-visible,a:focus-visible{outline:2px solid var(--c-accent);outline-offset:2px;}
  body{font-family:var(--font-fa);background:radial-gradient(ellipse 900px 500px at 15% -5%, rgba(255,255,255,0.9), transparent 60%), radial-gradient(ellipse 700px 500px at 100% 10%, rgba(255,255,255,0.5), transparent 55%), var(--c-bg);background-attachment:fixed;color:var(--c-ink);margin:0;padding:0;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:480px;margin:0 auto;padding:var(--sp-4);}
  @keyframes lumeraFadeIn{from{opacity:0;transform:translateY(8px) scale(0.99);}to{opacity:1;transform:translateY(0) scale(1);}}
  /* حذف نرم یک ردیف (اقلام فاکتور، مواد، دستمزد) — به‌جای ناپدید شدن ناگهانی، محو و جمع می‌شه */
  [data-line],[data-item],[data-labor],[data-payment],[data-row-id]{transition:opacity .18s ease,transform .18s ease,max-height .2s ease,margin .18s ease;}
  .row-removing{opacity:0!important;transform:scale(0.96)!important;max-height:0!important;margin:0!important;overflow:hidden;pointer-events:none;}
  #tabContent{animation:lumeraFadeIn 320ms var(--ease);}
  @media (prefers-reduced-motion:reduce){ #tabContent{animation:none;} }
  h1{font-size:var(--fs-h1);font-weight:var(--fw-bold);letter-spacing:-0.01em;margin:0 0 2px;color:var(--c-ink);}
  .sub{color:var(--c-steel);font-size:var(--fs-sub);margin:0 0 var(--sp-4);}

  /* ---- هدر رنگی (بنر گرادیانت با گوشه‌های گرد پایین) — مثل هدر اپ‌های موبایل مرجع، با رنگ خودمون ---- */
  /* هدر ساده — بدون بلوک رنگی؛ فقط لوگو با رنگ اصلی خودش + یه متن کوچیک کنارش، روی همون پس‌زمینه‌ی برنامه */
  .brand-header{
    display:flex;
    align-items:center;
    gap:10px;
    padding:6px 2px 4px;
    margin-bottom:14px;
  }
  .brand-header img{width:30px;height:30px;object-fit:contain;flex-shrink:0;}
  .brand-header .brand-text{font-size:14px;font-weight:var(--fw-bold);color:var(--c-accent);letter-spacing:0.01em;}
  .mobile-nav-bar{position:relative;}

  /* ---- Tab bar ---- */
  .tabs{display:flex;gap:2px;border-bottom:none;margin-bottom:var(--sp-4);overflow-x:auto;background:var(--c-surface);border-radius:var(--r-md);padding:5px;scrollbar-width:none;box-shadow:var(--sh-inset);}
  .tabs::-webkit-scrollbar{display:none;}
  .nav-icon{display:inline-flex;color:var(--c-steel);transition:color .15s ease,transform .15s ease;}
  /* آیتم‌های داخل شیت پایین (زیرشاخه‌های «مالی»/«داشبورد») به‌صورت کارت‌های کوچیک توی یک گرید کنار هم میان —
     به‌جای یه لیست تک‌ستونه‌ی بلند، جای کمتری می‌گیره و همه‌چیز یه‌نگاهی دیده می‌شه */
  .sheet-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:2px 16px 16px;}
  .nav-leaf{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:14px 6px;border:1px solid var(--c-line-soft);border-radius:14px;background:var(--c-surface);font-family:inherit;font-size:11.5px;font-weight:500;color:var(--c-ink);cursor:pointer;transition:background .15s ease,color .15s ease,border-color .15s ease;}
  .nav-leaf .nav-icon svg{width:22px;height:22px;}
  .nav-leaf:hover{background:rgba(0,0,0,0.04);}
  .nav-leaf-active{background:rgba(230,30,50,0.08)!important;border-color:var(--c-accent);font-weight:700;color:var(--red);}
  .nav-leaf-active .nav-icon{color:var(--red);}
  /* ---- Bottom sheet (برای انتخاب زیرشاخه‌ی «مالی» یا «داشبورد») ---- */
  .sheet-backdrop{position:fixed;inset:0;background:rgba(20,22,24,0.35);backdrop-filter:blur(2px);z-index:200;opacity:0;transition:opacity .25s ease;pointer-events:none;}
  .sheet-backdrop.open{opacity:1;pointer-events:auto;}
  .bottom-sheet{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:var(--c-panel);border-radius:20px 20px 0 0;z-index:201;box-shadow:0 -8px 30px rgba(0,0,0,0.18);transform:translateY(105%);transition:transform .3s cubic-bezier(.4,0,.2,1);padding-bottom:calc(env(safe-area-inset-bottom,0px) + var(--sp-3));max-height:70vh;overflow-y:auto;}
  .sheet-backdrop.open .bottom-sheet{transform:translateY(0);}
  .sheet-handle{width:40px;height:4px;border-radius:2px;background:var(--c-line);margin:10px auto 4px;}
  .sheet-title{font-weight:var(--fw-bold);font-size:var(--fs-body);padding:6px 16px 10px;color:var(--c-ink);}
  /* ---- Bottom tab bar (ناوبری اصلی) ---- */
  .bottom-tab-bar{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:rgba(255,255,255,0.94);backdrop-filter:blur(10px) saturate(150%);-webkit-backdrop-filter:blur(10px) saturate(150%);border-top:1px solid var(--c-line-soft);display:flex;align-items:flex-end;justify-content:space-around;z-index:90;padding:6px 4px calc(env(safe-area-inset-bottom,0px) + 6px);box-shadow:0 -2px 16px rgba(0,0,0,0.06);}
  .bottom-tab-item{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;font-family:inherit;color:var(--c-steel);cursor:pointer;flex:1;padding:6px 2px;font-size:10.5px;transition:color .15s ease;}
  .bottom-tab-item svg{flex-shrink:0;}
  .bottom-tab-item.active{color:var(--c-accent);font-weight:700;}
  .bottom-tab-fab-wrap{flex:1;display:flex;justify-content:center;position:relative;}
  .bottom-tab-fab{position:absolute;bottom:14px;width:52px;height:52px;border-radius:50%;background:var(--c-accent);color:var(--c-white);border:none;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(230,30,50,0.35);cursor:pointer;transition:transform var(--t-fast) var(--ease);}
  .bottom-tab-fab:active{transform:scale(0.93);}
  /* فضای خالی پایین صفحه تا محتوا زیر نوار ثابت گم نشه */
  /* این پدینگ باید روی خودِ .wrap (کانتینر بیرونی) باشه نه فقط #tabContent، چون بخش «بک‌آپ» و یادداشت پایانی
     بعد از #tabContent میان و اگه فقط اون فاصله بگیره، این دوتا هنوز زیر نوار ثابت پایین گم می‌مونن */
  .wrap{padding-bottom:calc(76px + env(safe-area-inset-bottom,0px));padding-top:calc(var(--sp-4) + env(safe-area-inset-top,0px));}
  .tab-btn{display:flex;align-items:center;gap:5px;padding:9px 13px;font-size:var(--fs-label);background:none;border:none;border-radius:var(--r-sm);color:var(--c-steel);cursor:pointer;white-space:nowrap;font-family:inherit;font-weight:var(--fw-medium);transition:background var(--t-fast) var(--ease),color var(--t-fast) var(--ease),box-shadow var(--t-fast) var(--ease);}
  .tab-btn.active{background:var(--c-panel);color:var(--c-ink);font-weight:var(--fw-bold);box-shadow:var(--sh-raised-sm);}
  .tab-btn:hover:not(.active){color:var(--c-ink-soft);}
  .tab-btn svg{flex-shrink:0;}

  /* ---- Form controls ---- */
  input,select{font-family:inherit;font-size:var(--fs-body);color:var(--c-ink);border:1px solid var(--c-line);border-radius:var(--r-sm);padding:9px 10px;min-height:40px;width:100%;background:var(--c-panel);transition:box-shadow var(--t-fast) var(--ease),border-color var(--t-fast) var(--ease);}
  input:focus,select:focus{outline:none;border-color:var(--c-steel-light);box-shadow:0 0 0 3px rgba(20,22,24,0.05);}
  select{appearance:none;-webkit-appearance:none;-moz-appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' stroke='%237A7A7A' stroke-width='1.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");background-repeat:no-repeat;background-position:left 10px center;padding-left:28px;cursor:pointer;}
  .row-flex{display:flex;gap:var(--sp-2);align-items:center;margin-bottom:var(--sp-2);}

  /* ---- Buttons ---- */
  .btn{border:none;border-radius:var(--r-sm);padding:12px 16px;min-height:44px;font-size:var(--fs-body);font-weight:var(--fw-medium);cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform var(--t-fast) var(--ease),box-shadow var(--t-fast) var(--ease),opacity var(--t-fast) var(--ease),background var(--t-fast) var(--ease);}
  .backup-row{gap:var(--sp-3);}
  .backup-row .btn{min-height:48px;font-size:var(--fs-sub);font-weight:var(--fw-bold);}
  .btn:active{transform:translateY(1px) scale(0.98);}
  .btn-black{background:var(--c-ink);color:var(--c-white);box-shadow:var(--sh-flat);}
  .btn-black:hover{opacity:0.92;}
  .btn-outline{background:rgba(255,255,255,0.78);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);color:var(--c-ink);border:1px solid var(--c-line);}
  .btn-outline:hover{border-color:var(--c-accent);color:var(--c-accent);}
  .btn-red{background:var(--c-accent);color:var(--c-white);box-shadow:0 4px 12px rgba(230,30,50,0.22);}
  .btn-red:hover{opacity:0.94;}
  .btn-icon{background:none;border:none;color:var(--c-accent);cursor:pointer;padding:4px 8px;font-size:15px;transition:transform var(--t-fast) var(--ease),opacity var(--t-fast) var(--ease);}
  .btn-icon:active{transform:scale(0.9);}
  @media (hover:hover){
    .btn-black:hover,.btn-red:hover{transform:translateY(-1px) scale(1.015);box-shadow:0 6px 16px rgba(20,22,24,0.15);}
    .btn-outline:hover{transform:translateY(-1px) scale(1.015);box-shadow:0 4px 14px rgba(230,30,50,0.16);}
  }

  /* ---- Cards ---- */
  .card{background:rgba(255,255,255,0.85);backdrop-filter:blur(8px) saturate(150%);-webkit-backdrop-filter:blur(8px) saturate(150%);border:1px solid rgba(255,255,255,0.7);outline:1px solid var(--c-line-soft);outline-offset:-1px;border-radius:18px;padding:var(--sp-3);margin-bottom:var(--sp-2);box-shadow:var(--sh-flat);transition:box-shadow var(--t-fast) var(--ease),border-color var(--t-fast) var(--ease),transform var(--t-fast) var(--ease);}
  .card-active{border-color:var(--c-accent);}
  .card-title{font-weight:var(--fw-bold);font-size:var(--fs-body);color:var(--c-ink);display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .card-sub{font-size:var(--fs-label);color:var(--c-steel);}
  .box-gray{background:rgba(241,242,244,0.9);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);border-radius:16px;padding:var(--sp-3);margin-bottom:var(--sp-4);box-shadow:var(--sh-inset);}
  @media (hover:hover){
    .card:hover{box-shadow:var(--sh-raised-sm);transform:translateY(-1px);}
  }
  @media (prefers-reduced-motion:reduce){
    .card,.btn,.btn-icon,.bottom-sheet,.sheet-backdrop,.nav-icon,.bottom-tab-fab{transition:none!important;transform:none!important;}
  }

  /* ---------- چیدمان یکسان روی همه‌ی سایزها ---------- */
  /* قبلاً از این‌جا یه چیدمان جدا برای صفحه‌ی بزرگ (نوار کناری ثابت) بود که تشخیصش وابسته به hover/pointer
     بود — همون چیزی که با آپدیت iOS اشتباه تشخیص داده شد و باعث شد نوار کناری روی گوشی هم باز بمونه.
     برای این‌که این کلاس باگ کلاً از ریشه حذف بشه، الان چیدمان روی هر سایزی (گوشی، تبلت، کامپیوتر) یکیه:
     همون ستون تکی با نوار ناوبری پایین صفحه، مثل اپ‌های موبایل. */
  /* ---------- TABLET (600px–959px: فاصله‌گذاری راحت‌تر، بدون تغییر چیدمان تک‌ستونه موبایل) ---------- */
  @media (min-width:600px) and (max-width:959px){
    .wrap{padding:var(--sp-5);padding-bottom:calc(76px + env(safe-area-inset-bottom,0px));padding-top:calc(var(--sp-5) + env(safe-area-inset-top,0px));}
  }
  /* ---------- کامپیوتر (≥960px): همون چیدمان تک‌ستونه، ولی عریض‌تر تا وسط یه مانیتور بزرگ باریک و بی‌تناسب
     دیده نشه. هیچ شرط hover/pointer نداره — فقط عرض صفحه، که قابل‌اعتماده و منبع باگ قبلی نمی‌شه ---------- */
  @media (min-width:960px){
    .wrap, .bottom-sheet, .bottom-tab-bar{max-width:640px;}
  }
  @media (min-width:1280px){
    .wrap, .bottom-sheet, .bottom-tab-bar{max-width:760px;}
  }

  /* ---- Results panel ---- */
  .results{background:linear-gradient(160deg, rgba(255,255,255,0.06), rgba(255,255,255,0) 40%), var(--c-ink);color:var(--c-white);border-radius:var(--r-md);padding:var(--sp-4);margin-bottom:var(--sp-3);box-shadow:var(--sh-elevated);}
  .r-row{display:flex;justify-content:space-between;font-size:var(--fs-body);padding:4px 0;}
  .r-row span:last-child{font-family:'Inter',var(--font-fa);font-variant-numeric:tabular-nums;letter-spacing:0.01em;}
  .r-row.bold{font-weight:var(--fw-bold);}
  .r-row.accent{color:var(--c-accent);}
  hr.sep{border:none;border-top:1px solid rgba(255,255,255,0.14);margin:var(--sp-2) 0;}
  .empty{color:var(--c-steel-light);font-size:var(--fs-body);text-align:center;padding:var(--sp-6) 0;}

  /* ---- Pills / toggles ---- */
  .pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:var(--sp-2);}
  .pill{border:1px solid var(--c-line);border-radius:var(--r-pill);padding:5px 11px;font-size:var(--fs-label);background:rgba(255,255,255,0.8);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);color:var(--c-steel);cursor:pointer;font-family:inherit;transition:all var(--t-fast) var(--ease);}
  .pill-active{background:var(--c-ink);color:var(--c-white);border-color:var(--c-ink);}
  .pill:active{transform:scale(0.96);}
  .mode-toggle{display:flex;gap:var(--sp-2);margin-bottom:var(--sp-2);}
  .mode-toggle button{flex:1;}
  label.small{font-size:var(--fs-label);color:var(--c-steel);white-space:nowrap;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:4px;font-size:var(--fs-label);color:var(--c-ink-soft);margin-top:var(--sp-2);}
  /* KPI/dashboard widget emphasis: a .card whose only metric is a bold accent row reads as a stat tile */
  .grid2 > .card{padding:var(--sp-4);}
  .grid2 > .card .card-title{font-size:var(--fs-label);color:var(--c-steel);font-weight:var(--fw-medium);}
  .grid2 > .card .r-row.bold.accent{font-size:22px;font-weight:var(--fw-black);color:var(--c-accent);padding-top:2px;}
  /* عدد آماری کوچیک روی کارت‌های داشبورد (مثلا تعداد پروژه‌های فعال) — نباید با عدد قیمت اصلی توی ماشین‌حساب
     (بالا، همون سایز و وزن) قاطی بشه؛ یه‌خرده کوچیک‌تر و سبک‌تره چون فقط یه شمارشگره، نه مبلغ قیمت‌گذاری */
  .dash-stat-num{font-size:20px;font-weight:var(--fw-black);color:var(--c-accent);}
  @media (max-width:380px){
    .grid2{grid-template-columns:1fr;gap:8px;}
  }
  h2.sec{font-size:var(--fs-label);font-weight:var(--fw-bold);margin-bottom:var(--sp-2);letter-spacing:0.01em;text-transform:none;}
  .note{font-size:var(--fs-caption);color:var(--c-steel);margin-top:var(--sp-6);text-align:center;}

  /* ---- INVOICE TAB ---- */
  .inv-status{display:inline-block;font-size:var(--fs-caption);font-weight:var(--fw-bold);border-radius:var(--r-pill);padding:3px 10px;cursor:pointer;user-select:none;border:1px solid var(--c-line);}
  .inv-status.draft{background:var(--c-surface);color:var(--c-steel);border-color:var(--c-line);}
  .inv-status.final{background:var(--c-accent-soft);color:var(--c-accent);border-color:var(--c-accent);}
  .inv-status.paid{background:var(--c-success-soft);color:var(--c-success);border-color:var(--c-success);}
  .inv-status.cancelled{background:var(--c-surface);color:var(--c-steel-light);border-color:var(--c-line);text-decoration:line-through;}
  .inv-line{display:flex;gap:6px;align-items:center;margin-bottom:6px;}
  .inv-line select{flex:1.4;}
  .inv-line input.qty{width:54px;}
  .inv-line .lt{flex:1;font-size:var(--fs-label);}
  .badge-activity{display:inline-block;font-size:var(--fs-caption);border-radius:6px;padding:2px 8px;background:var(--c-ink);color:var(--c-white);margin-left:4px;}

  /* ---- A4 print invoice (flat, print-safe — no neomorphism) ---- */
  #invoiceRenderRoot{position:fixed;left:-9999px;top:0;}
  .a4-wrap{width:794px;background:#fff;font-family:'Vazirmatn',Tahoma,Arial,sans-serif;direction:rtl;}
  .a4-page{padding:40px 52px 32px 52px;display:flex;flex-direction:column;}
  .a4-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
  .a4-header-right{display:flex;flex-direction:column;gap:3px;}
  .a4-header-name{font-size:13px;font-weight:700;color:#2F3338;white-space:nowrap;}
  .a4-header-meta{font-size:10.5px;color:#6B7075;white-space:nowrap;}
  .a4-logo{height:60px;width:auto;object-fit:contain;}
  .a4-title-bar{display:flex;align-items:center;gap:14px;margin-bottom:16px;}
  .a4-red-line{flex:1;height:2px;background:var(--c-accent);}
  .a4-invoice-title{font-size:20px;font-weight:800;color:#2F3338;white-space:nowrap;}
  .a4-grid{display:grid;gap:1px;background:#E0E0E0;border-radius:10px;overflow:hidden;margin-bottom:8px;}
  .a4-meta-grid{grid-template-columns:1.3fr 1.3fr 1fr 1fr 1fr;}
  .a4-customer-grid{grid-template-columns:2fr 1.2fr 1fr;margin-bottom:14px;}
  .a4-cell{background:#F7F7F7;padding:9px 13px;display:flex;flex-direction:column;gap:4px;overflow:hidden;}
  .a4-cell-label{font-size:9.5px;color:#6B7075;font-weight:500;white-space:nowrap;}
  .a4-cell-value{font-size:11.5px;color:#2F3338;font-weight:600;white-space:nowrap;overflow:hidden;}
  .a4-note{font-size:9.5px;color:#6B7075;margin-bottom:4px;}
  .a4-table{width:100%;border-collapse:separate;border-spacing:0;margin-bottom:4px;}
  .a4-table thead tr{background:#2F3338;}
  .a4-table thead th{padding:9px 10px;font-size:10.5px;font-weight:600;color:#fff;text-align:center;white-space:nowrap;}
  .a4-table thead th:first-child{border-radius:0 8px 0 0;}
  .a4-table thead th:last-child{border-radius:8px 0 0 0;}
  .a4-col-num{width:30px;}.a4-col-desc{width:33%;}.a4-col-mat{width:17%;}.a4-col-qty{width:8%;}.a4-col-unit{width:14%;}.a4-col-total{width:14%;}
  .a4-table tbody tr{background:#fff;}
  .a4-table tbody tr:nth-child(even){background:#FAFAFA;}
  .a4-table tbody td{padding:6px 8px;font-size:11px;text-align:center;height:34px;border-bottom:1px solid #F0F0F0;border-left:1px solid #F0F0F0;}
  .a4-table tbody td:last-child{border-left:none;}
  .a4-table tbody td.a4-col-desc{text-align:right;padding-right:10px;}
  .a4-row-num{font-size:9.5px;color:#C0C0C0;}
  .a4-bottom-grid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:12px;flex:1;}
  .a4-terms-box{background:#F7F7F7;border-radius:12px;padding:12px 14px;}
  .a4-terms-columns{display:flex;gap:16px;}
  .a4-terms-col{flex:1;min-width:0;}
  .a4-terms-col:not(:last-child){border-left:1px solid #E3E3E3;padding-left:16px;margin-left:-16px;}
  .a4-finance-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .a4-terms-title{font-size:10.5px;font-weight:700;color:#2F3338;margin-bottom:8px;padding-bottom:5px;border-bottom:1.5px solid var(--c-accent);display:inline-block;}
  .a4-terms-subtitle{font-size:9.5px;font-weight:700;color:#6B7075;margin:8px 0 4px;}
  .a4-terms-subtitle:first-of-type{margin-top:0;}
  .a4-group-row td{background:#F0F0F0;font-size:9.5px;font-weight:700;color:#2F3338;padding:4px 8px;text-align:right;}
  .a4-terms-list{list-style:none;display:flex;flex-direction:column;gap:5px;padding:0;margin:0;}
  .a4-terms-list li{font-size:9.5px;color:#6B7075;line-height:1.65;padding-right:10px;position:relative;}
  .a4-terms-list li::before{content:'';position:absolute;right:0;top:6px;width:3.5px;height:3.5px;background:#C0C0C0;border-radius:50%;}
  .a4-terms-list li.important{color:#2F3338;font-weight:600;}
  .a4-terms-list li.important::before{background:var(--c-accent);}
  .a4-summary-box{display:flex;flex-direction:column;gap:8px;}
  .a4-summary-card{background:#F7F7F7;border-radius:12px;padding:10px 13px;}
  .a4-summary-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid #ECECEC;}
  .a4-summary-row:last-child{border-bottom:none;}
  .a4-sr-label{font-size:10.5px;color:#6B7075;font-weight:500;}
  .a4-sr-value{font-size:10.5px;color:#2F3338;font-weight:600;}
  .a4-summary-row.total .a4-sr-label{font-size:11px;font-weight:700;color:#2F3338;}
  .a4-summary-row.total .a4-sr-value{font-size:13px;font-weight:800;color:var(--c-accent);}
  .a4-summary-row.balance .a4-sr-value{color:var(--c-accent);font-weight:700;}
  .a4-amount-words{font-size:9.5px;color:#6B7075;text-align:right;margin-top:6px;padding-top:6px;border-top:1px dashed #DDD;line-height:1.5;}
  .a4-prev-note{font-size:9px;color:#6B7075;margin-top:6px;padding-top:6px;border-top:1px dashed #DDD;line-height:1.5;}
  .a4-payment-card{background:#F7F7F7;border-radius:12px;padding:10px 13px;}
  .a4-payment-title{font-size:9.5px;font-weight:700;color:#6B7075;margin-bottom:7px;}
  .a4-footer{margin-top:14px;padding-top:10px;border-top:1px solid #E0E0E0;display:flex;justify-content:space-between;align-items:center;}
  .a4-footer-slogan{font-size:10px;font-weight:700;color:#2F3338;white-space:nowrap;}
  .a4-footer-social{font-size:10.5px;font-weight:600;color:#6B7075;white-space:nowrap;}
</style>
</head>

  let days = (365*gy) + (Math.floor((gy2+3)/4)) - (Math.floor((gy2+99)/100)) + (Math.floor((gy2+399)/400)) - 80 + gd + g_d_m[gm-1];
  jy += 33*Math.floor(days/12053);
  days %= 12053;
  jy += 4*Math.floor(days/1461);
  days %= 1461;
  if(days > 365){ jy += Math.floor((days-1)/365); days = (days-1)%365; }
  let jm, jd;
  if(days < 186){ jm = 1 + Math.floor(days/31); jd = 1 + (days%31); }
  else { jm = 7 + Math.floor((days-186)/30); jd = 1 + ((days-186)%30); }
  return [jy, jm, jd];
}
/* تبدیل شمسی به میلادی (معکوس toJalali — الگوریتم استاندارد jalaali) */
function toGregorian(jy, jm, jd){
  let gy = (jy <= 979) ? 621 : 1600;
  jy -= (jy <= 979) ? 0 : 979;
  let days = (365*jy) + (Math.floor(jy/33)*8) + Math.floor(((jy%33)+3)/4) + 78 + jd + ((jm < 7) ? (jm-1)*31 : ((jm-7)*30)+186);
  gy += 400*Math.floor(days/146097);
  days %= 146097;
  if(days > 36524){
    gy += 100*Math.floor(--days/36524);
    days %= 36524;
    if(days >= 365) days++;
  }
  gy += 4*Math.floor(days/1461);
  days %= 1461;
  if(days > 365){
    gy += Math.floor((days-1)/365);
    days = (days-1)%365;
  }
  let gd = days+1;
  const sal_a = [0,31,((gy%4===0 && gy%100!==0)||(gy%400===0))?29:28,31,30,31,30,31,31,30,31,30,31];
  let gm;
  for(gm=0; gm<13 && gd>sal_a[gm]; gm++) gd -= sal_a[gm];
  return [gy, gm, gd];
}
/* تبدیل رشته تاریخ شمسی به فرم ورودی کاربر (مثل ۱۴۰۳/۰۴/۰۵ یا 1403-04-05) به رشته میلادی ISO YYYY-MM-DD */
function jalaliInputToISO(str){
  if(!str) return '';
  const normalized = normalizeDigits(String(str).trim()).replace(/[\/\.]/g,'-');
  const parts = normalized.split('-').map(p=>parseInt(p,10));
  if(parts.length!==3 || parts.some(isNaN)) return '';
  let [jy,jm,jd] = parts;
  if(jy<100) jy += 1400; // ورودی کوتاه مثل 03-04-05 را به 1403 تعبیر می‌کنیم (بعید است، ولی محافظه‌کارانه)
  if(jm<1||jm>12||jd<1||jd>31) return '';
  const [gy,gm,gd] = toGregorian(jy,jm,jd);
  const p2 = n=>String(n).padStart(2,'0');
  return `${gy}-${p2(gm)}-${p2(gd)}`;
}
// کامپوننت ورودی تاریخ شمسی: یک input متنی که مقدار شمسی نشان می‌دهد، اما مقدار ذخیره‌شده همیشه میلادی ISO است
// placeholder نمونه‌ی فرمت را نشان می‌دهد؛ خطای ورودی نامعتبر را به‌صورت رنگ قرمز بوردر نشان می‌دهیم
function renderJalaliDateInput(id, isoValue, extraStyle){
  const display = isoValue ? jalaliStr(isoValue) : '';
  return `<input id="${id}" inputmode="numeric" placeholder="۱۴۰۳/۰۴/۰۵" value="${escapeAttr(display)}" data-iso="${escapeAttr(isoValue||'')}" style="${extraStyle||''}">`;
}
// روی یک input ساخته‌شده با renderJalaliDateInput رویداد می‌بندد؛ با هر تغییر، مقدار را به ISO تبدیل کرده و callback را صدا می‌زند
function bindJalaliDateInput(id, onChangeISO){
  const el = document.getElementById(id);
  if(!el) return;
  el.addEventListener('blur', e=>{
    const iso = jalaliInputToISO(e.target.value);
    if(!e.target.value.trim()){ el.style.borderColor=''; onChangeISO(''); return; }
    if(!iso){
      el.style.borderColor = 'var(--red)';
      return; // مقدار نامعتبر را ذخیره نمی‌کنیم، کاربر باید اصلاح کند
    }
    el.style.borderColor = '';
    e.target.value = jalaliStr(iso);
    onChangeISO(iso);
  });
}
function toPersianDigits(str){
  const fa = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
  return String(str).replace(/[0-9]/g, d=>fa[+d]);
}
function toLatinDigits(str){
  const fa = '۰۱۲۳۴۵۶۷۸۹';
  return String(str).replace(/[۰-۹]/g, d=>String(fa.indexOf(d)));
}
function jalaliStr(dateStr){
  if(!dateStr) return '';
  const [gy,gm,gd] = dateStr.split('-').map(Number);
  if(!gy||!gm||!gd) return dateStr;
  const [jy,jm,jd] = toJalali(gy,gm,gd);
  const p2 = n=>String(n).padStart(2,'0');
  return toPersianDigits(`${jy}/${p2(jm)}/${p2(jd)}`);
}
// اول ماه شمسی جاری را به تاریخ میلادی ISO برمی‌گرداند — چون «این ماه» برای کاربر یعنی ماه شمسی، نه میلادی
function jalaliMonthStartISO(){
  const now = new Date();
  const [jy, jm] = toJalali(now.getFullYear(), now.getMonth()+1, now.getDate());
  const [gy, gm, gd] = toGregorian(jy, jm, 1);
  const p2 = n=>String(n).padStart(2,'0');
  return `${gy}-${p2(gm)}-${p2(gd)}`;
}
function invNumStr(n){
  return toPersianDigits(String(n).padStart(3,'0'));
}
function projectCodeDisplay(code){
  const c = (code||'').trim();
  if(!c) return '-';

function addMonths(dateStr, months){
  if(!dateStr) return '';
  const d = new Date(dateStr+'T00:00:00');
  if(isNaN(d.getTime())) return '';
  d.setMonth(d.getMonth()+months);
  return d.toISOString().slice(0,10);
}
function fmt(n){ if(!isFinite(n)) return '۰'; return Math.round(n).toLocaleString('fa-IR'); }
// تبدیل ارقام فارسی (۰-۹) و عربی (٠-٩) به ارقام لاتین، تا ورودی‌های prompt/input هم با اعداد فارسی درست پارس شوند
function normalizeDigits(str){
  if(str==null) return str;
  const persian = '۰۱۲۳۴۵۶۷۸۹', arabic = '٠١٢٣٤٥٦٧٨٩';
  return String(str).replace(/[۰-۹٠-٩]/g, ch=>{
    let idx = persian.indexOf(ch);
    if(idx===-1) idx = arabic.indexOf(ch);
    return idx===-1 ? ch : String(idx);
  }).replace(/[٫،]/g,'.'); // جداکننده اعشاری فارسی/عربی هم به نقطه تبدیل شود
}
// نسخه سراسری parseFloat را با نسخه‌ای جایگزین می‌کنیم که قبل از پارس، ارقام فارسی/عربی را به لاتین تبدیل می‌کند.
// برای ورودی‌های لاتین رفتار کاملاً یکسان با parseFloat اصلی دارد — فقط ورودی فارسی/عربی هم پشتیبانی می‌شود.
const _nativeParseFloat = parseFloat;
parseFloat = function(str){
  if(typeof str === 'string') return _nativeParseFloat(normalizeDigits(str));
  return _nativeParseFloat(str);
};
function parseNum(str){ return parseFloat(normalizeDigits(str)); }
// خواندن مقدار عددی که نباید منفی باشد (مثل تعداد/qty) — مقادیر منفی یا نامعتبر به صفر تبدیل می‌شوند
// این از قیمت تمام‌شده یا جمع فاکتور منفی شدن به‌خاطر تعداد منفی جلوگیری می‌کند
function parseQty(val){ const n = parseFloat(val); return (isNaN(n) || n<0) ? 0 : n; }
function numberToPersianWords(num){
  num = Math.round(Math.abs(num||0));
  if(num===0) return 'صفر';
  const ones = ['','یک','دو','سه','چهار','پنج','شش','هفت','هشت','نه'];
  const tens = ['','ده','بیست','سی','چهل','پنجاه','شصت','هفتاد','هشتاد','نود'];
  const teens = ['ده','یازده','دوازده','سیزده','چهارده','پانزده','شانزده','هفده','هجده','نوزده'];
  const hundreds = ['','یکصد','دویست','سیصد','چهارصد','پانصد','ششصد','هفتصد','هشتصد','نهصد'];
  const scales = ['','هزار','میلیون','میلیارد','تریلیون'];
  function threeDigits(n){
    n = parseInt(n,10);
    if(n===0) return '';
    const h = Math.floor(n/100), t = Math.floor((n%100)/10), o = n%10;
    const parts = [];
    if(h) parts.push(hundreds[h]);
    if(t===1) parts.push(teens[o]);
    else {
      if(t) parts.push(tens[t]);
      if(o) parts.push(ones[o]);
    }
    return parts.join(' و ');
  }
  const groups = [];
  let n = num;
  while(n>0){ groups.unshift(n%1000); n = Math.floor(n/1000); }
  const parts = [];
  for(let i=0;i<groups.length;i++){
    const g = groups[i];
    if(g===0) continue;
    const scaleIdx = groups.length-1-i;
    const words = threeDigits(g);
    parts.push(scaleIdx>0 ? words+' '+scales[scaleIdx] : words);
  }
  return parts.join(' و ');
}
function amountToWordsToman(n){
  const words = numberToPersianWords(n);
  return words + ' تومان';
}
function escapeAttr(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

// عکس آپلودشده را قبل از ذخیره کوچک و فشرده می‌کند تا حجم زیاد حافظه مرورگر را پر نکند
function resizeImageFile(file, maxDim, callback){
  const reader = new FileReader();
  reader.onload = ev=>{
    const img = new Image();
    img.onload = ()=>{
      let w = img.width, h = img.height;
      if(w>=h){ if(w>maxDim){ h = Math.round(h*maxDim/w); w = maxDim; } }
      else { if(h>maxDim){ w = Math.round(w*maxDim/h); h = maxDim; } }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      callback(canvas.toDataURL('image/jpeg', 0.75));
    };
    img.onerror = ()=> alert('این فایل به‌عنوان تصویر خوانده نشد');
    img.src = ev.target.result;
  };
  reader.onerror = ()=> alert('خواندن فایل ناموفق بود');
  reader.readAsDataURL(file);
}

// هزینه هر ردیف دستمزد را برمی‌گرداند — یا عدد دستی‌ست، یا برای برش لیزر از فرمول (طول × ذخامت × نرخ) محاسبه می‌شود
function laborItemCost(l){
  if(l.calcType==='laser'){
    const length = parseFloat(l.length)||0;
    const thickness = parseFloat(l.thickness)||0;
    const rate = parseFloat(l.rate)||0;
    return length*thickness*rate;
  }
  return parseFloat(l.cost)||0;
}
function computeTotals(){
  const materialsBreakdown = calc.items.map(it=>{
    const mat = materials.find(m=>m.id===it.materialId);
    const qty = parseQty(it.qty);
    const price = mat? mat.price : 0;
    return { name: mat?mat.name:'-', qty, unit: mat?mat.unit:'', price, subtotal: price*qty };
  });
  const materialsCost = materialsBreakdown.reduce((s,m)=>s+m.subtotal,0);
  const laborBreakdown = calc.laborItems.map(l=>{
    const subtotal = laborItemCost(l);
    let detail = '';
    if(l.calcType==='laser'){
      const length = parseFloat(l.length)||0;
      const thickness = parseFloat(l.thickness)||0;
      const rate = parseFloat(l.rate)||0;
      const equivLength = length*thickness;
      detail = `${toPersianDigits(length)} متر × ذخامت ${toPersianDigits(thickness)} میل = ${fmt(equivLength)} متر معادل × ${fmt(rate)} ت`;
    }
    return { name: l.name || (l.calcType==='laser'?'برش لیزر':'دستمزد'), subtotal, detail, calcType: l.calcType||'manual' };
  });
  const laborCost = laborBreakdown.reduce((s,l)=>s+l.subtotal,0);
  const autoOverhead = computeAutoOverhead();
  const overheadCost = calc.useAutoOverhead ? autoOverhead.perUnit : 0;
  const totalCost = materialsCost + laborCost + overheadCost;
  let consumerPrice = 0;
  if(calc.pricingMode==='margin'){
    const pct = parseFloat(calc.marginPct)||0;
    consumerPrice = totalCost*(1+pct/100);
  } else {
    consumerPrice = parseFloat(calc.manualPrice)||0;
  }
  const profit = consumerPrice - totalCost;
  const profitPct = totalCost>0 ? (profit/totalCost*100) : 0;
  return {materialsCost, laborCost, overheadCost, totalCost, consumerPrice, profit, profitPct, autoOverheadInfo: autoOverhead, materialsBreakdown, laborBreakdown};
}

function bindCalcEvents(){
  document.getElementById('autoOverheadToggle')?.addEventListener('change', e=>{
    calc.useAutoOverhead = e.target.checked;
    render();
  });
  document.getElementById('applySuggestedOverheadBtn')?.addEventListener('click', ()=>{
    const suggestion = suggestOverheadPercent(3);
    if(!suggestion) return;
    overheadPercent = suggestion.percent;
    saveJSON(STORE_KEYS.overheadPercent, overheadPercent);
    render();
  });
  document.getElementById('setOverheadPctBtn')?.addEventListener('click', ()=>{
    const val = document.getElementById('manualOverheadPctInput')?.value;
    const num = parseFloat(val);
    if(isNaN(num) || num<0){ alert('عدد معتبر برای درصد وارد کن'); return; }
    overheadPercent = num;
    saveJSON(STORE_KEYS.overheadPercent, overheadPercent);
    render();
  });
  document.getElementById('editOverheadPctBtn')?.addEventListener('click', ()=>{
    const val = prompt('درصد سربار نسبت به قیمت تمام‌شده هر محصول:', String(overheadPercent));

    const num = parseFloat(val);
    if(isNaN(num) || num<0){ alert('عدد معتبر وارد کن'); return; }

    el.addEventListener('input', e=>{

      calc.laborItems[idx].length = e.target.value;

      calc.laborItems[idx].thickness = e.target.value;

function finalizeRecord(){
  const name = document.getElementById('productNameInput').value.trim();
  if(!name || (calc.items.length===0 && calc.laborItems.length===0)){ alert('نام محصول و حداقل یک ماده یا دستمزد لازم است'); return; }
  const t = computeTotals();
  const recDate = calc.recordDate || todayStr();
  // اگر همین محصول قبلاً در همین تاریخ ثبت شده باشد (مثلا اصلاح یک اشتباه)، جایگزین می‌شود
  // نه اینکه رکورد تازه‌ای روی آن اضافه شود — این باعث انباشته‌شدن بی‌مورد تاریخچه می‌شد
  const existingIdx = records.findIndex(r=> r.name===name && r.date===recDate);
  const rec = { id: existingIdx>=0 ? records[existingIdx].id : Date.now().toString(), date: recDate, name, ...t };
  if(existingIdx>=0) records[existingIdx] = rec; else records = [rec, ...records];
  saveJSON(STORE_KEYS.records, records);
  // فرمول محصول (مواد و دستمزد) هم همین‌جا در کاتالوگ ذخیره/به‌روزرسانی می‌شود تا دفعه بعد قابل ویرایش باشد
  saveCurrentAsProduct(name, false);
  clearCalc();
  tab='history';
  render();
}
function saveCurrentAsProduct(nameOverride, showAlert){
  const name = nameOverride!==undefined ? nameOverride : document.getElementById('productNameInput').value.trim();
  if(!name || (calc.items.length===0 && calc.laborItems.length===0)){ if(showAlert!==false) alert('نام محصول و حداقل یک ماده یا دستمزد لازم است'); return; }
  const idx = products.findIndex(p=>p.name===name);
  const existing = idx>=0 ? products[idx] : null;
  const data = {
    id: existing ? existing.id : Date.now().toString(),
    name,
    categoryId: existing ? existing.categoryId : '',
    dimensions: existing ? existing.dimensions : '',
    image: existing ? existing.image : '',
    items: calc.items,
    laborItems: calc.laborItems
  };
  if(idx>=0) products[idx]=data; else products.push(data);
  saveJSON(STORE_KEYS.products, products);
  if(showAlert!==false) alert('قالب ذخیره شد');
}

function buildTermsSectionsHTML(typesUsed){

function productSalePrice(productName){
  const rec = records.find(r=>r.name===productName);
  return rec ? rec.consumerPrice : 0;
}
function productSalePriceOf(productId){
  const p = products.find(x=>x.id===productId);
  return p ? productSalePrice(p.name) : 0;
}
function invLineBasePrice(line){
  if(line.productId){
    const p = products.find(x=>x.id===line.productId);
    return p ? productSalePrice(p.name) : 0;
  }
  return parseFloat(line.customPrice)||0;
}
function invLineUnitPrice(line){
  // سازگاری با نسخه‌ی قبلی: اگر «فی توافقی» قدیمی (overridePrice) روی این ردیف ثبت شده، همون رو در نظر می‌گیریم
  if(line.overridePrice!==undefined && line.overridePrice!==null && String(line.overridePrice).trim()!==''){
    return Math.max(0, parseFloat(line.overridePrice)||0);
  }
  const base = invLineBasePrice(line);
  const disc = parseFloat(line.lineDiscount)||0;
  return Math.max(0, base - disc);
}
// قیمت تمام‌شده‌ی هر واحد یک محصول ذخیره‌شده، بر اساس قیمت روز مواد و دستمزدهای ثبت‌شده در فرمول آن (بدون سربار)
function computeProductCost(product){
  if(!product) return 0;
  const materialsCost = (product.items||[]).reduce((s,it)=>{
    const mat = materials.find(m=>m.id===it.materialId);
    const qty = parseQty(it.qty);
    return s + (mat? mat.price*qty : 0);
  },0);
  const laborCost = (product.laborItems||[]).reduce((s,l)=>s+laborItemCost(l),0);
  return materialsCost + laborCost;
}
// قیمت تمام‌شده‌ی هر واحد یک ردیف فاکتور: برای ردیف‌های متصل به محصول، خودکار از فرمول محصول محاسبه می‌شود؛
// برای ردیف‌های دلخواه/دستی، فقط اگر کاربر «قیمت تمام‌شده» را وارد کرده باشد مشخص است، وگرنه صفر در نظر گرفته می‌شود
// (یعنی کل مبلغ آن ردیف به‌عنوان سود حساب می‌شود — برای محاسبه‌ی دقیق سود، پر کردن این فیلد توصیه می‌شود)
function invLineUnitCost(line){
  if(line.productId){
    const p = products.find(x=>x.id===line.productId);
    return p ? computeProductCost(p) : 0;
  }
  return parseFloat(line.customCost)||0;
}
function invLineName(line){
  if(line.productId){
    const p = products.find(x=>x.id===line.productId);
    return p ? p.name : '';
  }
  return line.customName||'';
}
// چند تا ردیف از یک فضای کاری خاص توی این فاکتور هست — برای نشون دادن عدد کنار تب‌های فضای کاری
function invoiceWorkspaceCount(inv, type){
  return inv.lines.filter(l=>(l.activityType||inv.activityType||'lumera')===type).length;
}
// لیست نوع‌فعالیت‌هایی که واقعاً توی این فاکتور استفاده شدن (بر اساس ردیف‌ها)، به ترتیب ثابت
function invoiceActivityTypesUsed(inv){
  const order = ['lumera','drafting','graphic'];
  const set = new Set(inv.lines.map(l=>l.activityType || inv.activityType || 'lumera'));
  return order.filter(t=>set.has(t));
}
function computeInvoiceTotals(inv){
  const linesTotal = inv.lines.reduce((s,l)=>{
    const qty = parseQty(l.qty);
    return s + invLineUnitPrice(l)*qty;
  },0);
  // قیمت تمام‌شده‌ی کل فاکتور — برای ردیف‌های دلخواه بدون «قیمت تمام‌شده» ثبت‌شده، صفر در نظر گرفته می‌شود
  // (یعنی هنوز نمی‌دونیم چقدر هزینه داشتن، پس فعلاً کل مبلغشون سود حساب می‌شه)
  const costTotal = inv.lines.reduce((s,l)=>{
    const qty = parseQty(l.qty);
    return s + invLineUnitCost(l)*qty;
  },0);
  let discount = 0;
  if(parseFloat(inv.discountPct)>0) discount += linesTotal*(parseFloat(inv.discountPct)/100);
  if(parseFloat(inv.discountAmount)>0) discount += parseFloat(inv.discountAmount);
  const grandTotal = Math.max(0, linesTotal - discount);
  // اگر ردیف‌های واریزی ریز ثبت شده باشند، جمعشون ملاک است؛ وگرنه فیلد قدیمی «پرداخت‌شده» (برای فاکتورهای قبل از این نسخه)
  const payments = Array.isArray(inv.payments) ? inv.payments : [];
  const paid = payments.length>0 ? payments.reduce((s,p)=>s+(parseFloat(p.amount)||0),0) : (parseFloat(inv.paidAmount)||0);
  const balance = Math.max(0, grandTotal - paid);
  // اگر پرداختی بیشتر از جمع کل فاکتور باشد، آن مقدار اضافه به نفع مشتری (بستانکاری) است و نباید گم شود
  const overpaid = Math.max(0, paid - grandTotal);
  // سود قبل و بعد از تخفیف — تخفیف باید از سود کم بشه، نه این‌که وارد قیمت تمام‌شده (ضرر) بشه
  const profitBeforeDiscount = linesTotal - costTotal;
  const profitAfterDiscount = profitBeforeDiscount - discount;
  return {linesTotal, costTotal, profitBeforeDiscount, profitAfterDiscount, discount, grandTotal, paid, balance, overpaid, payments};
}

// مانده/بدهی قبلی مشتری — مستقل از همین فاکتور، یعنی مانده‌ای که از قبل (فاکتورهای پیشین + واریزی‌ها) باقی مانده
// مثبت = مشتری بدهکار است (باید به ما بدهد) | منفی = مشتری بستانکار است (ما به او بدهکاریم)
// getBalance اختیاریه: توی لیست فاکتورها، نسخه‌ی حافظه‌دار customerBalanceMemoized پاس داده می‌شه تا برای
// مشتری‌های تکراری، حساب مانده از اول انجام نشه (روی لیست‌های بلند، تفاوت سرعت محسوسه)
function invoicePrevBalanceAuto(inv, getBalance){
  if(!inv.customerId) return 0;
  const balanceFn = getBalance || customerBalance;
  const bal = balanceFn(inv.customerId); // net>0 یعنی بستانکار، net<0 یعنی بدهکار
  let net = bal.net;
  // اگر همین فاکتور قبلاً ذخیره شده و در حالت final/paid است، مانده‌ی خودش را از حساب کلی مشتری کم می‌کنیم
  // تا «بدهی قبلی» فقط شامل فاکتورهای دیگر باشد، نه خود این فاکتور
  if(inv.id){
    const saved = invoices.find(i=>i.id===inv.id);
    if(saved && saved.status!=='draft' && saved.status!=='cancelled'){
      const t = computeInvoiceTotals(saved);
      // باید هم سمت بدهکاری (t.balance) و هم سمت اضافه‌پرداخت (t.overpaid) خودِ همین فاکتور خنثی بشه؛
      // قبلاً فقط t.balance برگردانده می‌شد و t.overpaid این فاکتور به‌اشتباه به‌عنوان «بستانکاری از فاکتور
      // قبلی» باقی می‌ماند و باعث دوبار حساب‌شدن اضافه‌پرداخت همین فاکتور در «مانده نهایی» می‌شد.
      net = net + Math.max(0, t.balance) - t.overpaid;
    }
  }
  return -net; // برگرداندن به فرم «بدهکاری مثبت»
}
function invoicePrevBalanceFinal(inv, getBalance){
  if(inv.prevBalanceUseManual) return parseFloat(inv.prevBalanceManual)||0;
  return invoicePrevBalanceAuto(inv, getBalance);
}

function newInvoiceFromDraft(){
  invDraft = blankInvoice();
  invActiveWorkspace = null;
  editingInvId = null;
  invTab = 'edit';
}
function loadInvoiceForEdit(id){
  const inv = invoices.find(i=>i.id===id);
  if(!inv) return;
  invDraft = JSON.parse(JSON.stringify(inv));
  if(invDraft.lines.length===0) invDraft.lines.push(blankInvoiceLine());
  // فاکتورهای قدیمی‌تر از این نسخه فقط یک عدد «پرداخت‌شده» ساده داشتند، نه ریز واریزی با تاریخ.
  // موقع باز کردن برای ویرایش، همون عدد رو به یک ردیف واریزی تبدیل می‌کنیم تا با اضافه‌کردن واریزی جدید گم نشه
  if((!Array.isArray(invDraft.payments) || invDraft.payments.length===0) && parseFloat(invDraft.paidAmount)>0){
    invDraft.payments = [{id:'legacy-'+id, date: invDraft.date, amount: invDraft.paidAmount, note:'پرداخت ثبت‌شده قبل از افزودن ریز واریزی‌ها'}];
  }
  if(!Array.isArray(invDraft.payments)) invDraft.payments = [];
  // فضای کاری فعال رو روی نوع فعالیت اولین ردیف (یا فعالیت قدیمی خود فاکتور) می‌ذاریم تا خالی به‌نظر نرسه
  invActiveWorkspace = (invDraft.lines[0] && invDraft.lines[0].activityType) || invDraft.activityType || 'lumera';
  editingInvId = id;
  invTab = 'edit';
}
// کپی سریع یک فاکتور قدیمی — برای مشتری‌های تکراری که دوباره همون کالاها رو سفارش می‌دن، به‌جای این‌که از صفر
// همه‌ی ردیف‌ها رو بسازی، فقط تاریخ و پرداخت‌ها خالی می‌شه و بقیه (مشتری، ردیف‌ها، تخفیف، یادداشت) کپی می‌مونه
function duplicateInvoice(id){
  const inv = invoices.find(i=>i.id===id);
  if(!inv) return;
  const clone = JSON.parse(JSON.stringify(inv));
  delete clone.id;
  clone.number = null; // شماره‌ی جدید موقع ذخیره گرفته می‌شه
  clone.status = 'draft';
  clone.date = todayStr();
  clone.validTo = '';
  clone.deliveryDueDate = '';
  clone.payments = [];
  clone.paidAmount = '';
  clone.prevBalanceUseManual = false;
  clone.prevBalanceManual = '';
  clone.prevBalanceNote = '';
  // آی‌دی تازه برای هر ردیف تا با فاکتور اصلی قاطی نشه
  clone.lines = (clone.lines||[]).map(l=> ({...l, id: Date.now().toString()+Math.random().toString(36).slice(2)}));
  invDraft = clone;
  invActiveWorkspace = (invDraft.lines[0] && invDraft.lines[0].activityType) || invDraft.activityType || 'lumera';
  editingInvId = null;
  invTab = 'edit';
}
function resolveInvoiceStatus(inv, targetStatus){
  let status = targetStatus || inv.status || 'draft';
  if(status==='final' || status==='paid'){
    const t = computeInvoiceTotals(inv);
    status = (t.grandTotal>0 && t.balance<=0) ? 'paid' : 'final';
  }
  return status;
}
function ensureCustomerLinked(invDraftObj){
  const name = (invDraftObj.customerName||'').trim();
  if(!name) return invDraftObj.customerId || '';
  // اگه قبلاً به یک مشتری موجود وصل شده، همان را نگه دار
  if(invDraftObj.customerId && customers.some(c=>c.id===invDraftObj.customerId)) return invDraftObj.customerId;
  // اگه اسم دقیقاً با یک مشتری موجود یکی بود، به همان وصل شود (بدون ساخت تکراری)
  const existing = customers.find(c=>c.name.trim()===name);
  if(existing) return existing.id;
  // وگرنه مشتری جدید ساخته شود
  const c = { id: Date.now().toString()+Math.random().toString(36).slice(2), name, phone: (invDraftObj.customerPhone||'').trim() };
  customers = [...customers, c];
  saveJSON(STORE_KEYS.customers, customers);
  return c.id;
}
function saveInvoiceDraft(targetStatus){
  if(!invDraft.customerName.trim() && invDraft.lines.every(l=>!invLineName(l))){
    alert('حداقل نام مشتری یا یک ردیف کالا را وارد کنید'); return;
  }
  // اگه تخفیف (چه از فیلد تخفیف، چه از فی توافقی هر ردیف) از سود این فاکتور بیشتر باشه، یعنی داره وارد قیمت
  // تمام‌شده (ضرر) میشه — اجازه ثبت نمی‌دیم
  const tCheck = computeInvoiceTotals(invDraft);
  if(tCheck.profitAfterDiscount<0){
    const reason = tCheck.discount>0
      ? 'تخفیف واردشده: ' + fmt(tCheck.discount) + ' تومان'
      : 'یکی از ردیف‌ها با تخفیف ردیف، پایین‌تر از قیمت تمام‌شده ثبت شده';
    alert('این فاکتور زیر قیمت تمام‌شده حساب می‌شه و ضرر داره.\nسود این فاکتور قبل از تخفیف: ' + fmt(tCheck.profitBeforeDiscount) + ' تومان\n' + reason + '\nبرای ثبت، تخفیف رو اصلاح کن.');
    return;
  }
  if(targetStatus==='final' && !invDraft.validTo){
    invDraft.validFrom = invDraft.date;
    invDraft.validTo = addMonths(invDraft.date, 1);
  }
  if(targetStatus==='final'){
    invDraft.customerId = ensureCustomerLinked(invDraft);
  }
  // لایه دفاعی: فقط زمانی فاکتور موجود را ویرایش (merge) کن که id واقعاً با همان فاکتور تطبیق داشته باشد
  // این از overwrite ناخواسته جلوگیری می‌کند، حتی اگر editingInvId به اشتباه از یک مسیر دیگر باقی مانده باشد
  const existingIdx = editingInvId ? invoices.findIndex(i=>i.id===editingInvId) : -1;
  if(editingInvId && existingIdx>=0 && invDraft.id && invDraft.id===editingInvId){
    const idx = existingIdx;
    const merged = {...invDraft, status: targetStatus || invDraft.status};
    merged.status = resolveInvoiceStatus(merged, merged.status);
    invoices[idx] = merged;
    if(merged.number!=null && !isNaN(merged.number) && merged.number>=invoiceSeq){
      invoiceSeq = merged.number + 1;
      saveJSON(STORE_KEYS.invoiceSeq, invoiceSeq);
    }
  } else {
    const num = (invDraft.number!=null && !isNaN(invDraft.number)) ? invDraft.number : invoiceSeq;
    invoiceSeq = Math.max(invoiceSeq, num + 1);
    saveJSON(STORE_KEYS.invoiceSeq, invoiceSeq);
    const inv = {...invDraft, id: Date.now().toString(), number: num, status: targetStatus || 'draft'};
    inv.status = resolveInvoiceStatus(inv, inv.status);
    invoices = [inv, ...invoices];
    editingInvId = inv.id;
  }
  saveJSON(STORE_KEYS.invoices, invoices);
  invTab = 'list';
  render();
}
function deleteInvoice(id){
  invoices = invoices.filter(i=>i.id!==id);
  saveJSON(STORE_KEYS.invoices, invoices);
  render();
}
function cycleInvoiceStatusInList(id){
  const idx = invoices.findIndex(i=>i.id===id);
  if(idx<0) return;
  const cur = invoices[idx].status;
  const order = {draft:'final', final:'paid', paid:'cancelled', cancelled:'draft'};
  invoices[idx].status = order[cur] || 'draft';
  saveJSON(STORE_KEYS.invoices, invoices);
  render();
}

let invSearchDebounceTimer = null;
// تعداد فاکتورهایی که فعلاً توی لیست نشون داده می‌شن — برای اینکه لیست فاکتورهای زیاد (بعد از ماه‌ها کارکردن)
// کل صفحه رو کند نکنه؛ با دکمه‌ی «نمایش بیشتر» زیاد می‌شه
let invListVisibleCount = 30;
// فیلتر سریع — وقتی از داشبورد روی یه عدد (مثلا «پروژه‌های فعال») کلیک می‌کنی، همین فیلتر ست می‌شه تا
// مستقیم همون فاکتورها رو ببینی، نه این‌که خودت دنبالشون بگردی
let invQuickFilter = null; // null | 'active' | 'drafts'
function invoiceMatchesQuickFilter(inv){
  if(invQuickFilter==='active') return inv.status!=='cancelled' && inv.status!=='draft' && inv.projectStatus!=='delivered';
  if(invQuickFilter==='drafts') return inv.status==='draft';
  return true;
}

  // باید حساب کل فاکتورهای همون مشتری رو بررسی کنه) گرون‌ترین بخش این صفحه‌ست، پس محدودش می‌کنیم

// نمایش سود قبل/بعد از تخفیف، زیر فیلدهای تخفیف — تا کاربر قبل از ثبت فاکتور بفهمه تخفیف یا فی توافقی وارد سود شده یا نه
function invoiceProfitHintHTML(t){
  const unknownCostLines = invDraft.lines.some(l=>!l.productId && invLineName(l) && !((parseFloat(l.customCost)||0)>0));
  let html = `<p class="note" style="margin:6px 0 0;text-align:right">سود این فاکتور قبل از تخفیف: ${fmt(t.profitBeforeDiscount)} تومان</p>`;
  const warn = t.profitAfterDiscount < 0;
  if(t.discount>0){
    html += `<p class="note" style="margin:2px 0 0;text-align:right;${warn?'color:#C0392B;font-weight:700':''}">سود بعد از تخفیف: ${fmt(t.profitAfterDiscount)} تومان${warn?' — این تخفیف از سود بیشتره!':''}</p>`;
  } else if(warn){
    html += `<p class="note" style="margin:2px 0 0;text-align:right;color:#C0392B;font-weight:700">یکی از ردیف‌ها با تخفیف ردیف، زیر قیمت تمام‌شده ثبت شده — این فاکتور ضرر داره!</p>`;
  }
  if(unknownCostLines){
    html += `<p class="note" style="margin:2px 0 0;text-align:right">توجه: بعضی ردیف‌های دلخواه «قیمت تمام‌شده» ندارن، پس سود واقعی ممکنه کمتر از این عدد باشه</p>`;
  }
  return html;
}
function invoiceSummaryRows(t, prevBalFinal, customerId, excludeId){
  const openInvs = customerOpenInvoices(customerId, excludeId);
  const refStr = openInvs.length>0 ? ' (فاکتور ' + openInvs.map(o=>'#'+invNumStr(o.number)).join('، ') + ')' : '';
  const finalRem = (t.grandTotal + prevBalFinal) - t.paid;
  let html = `<div class="r-row bold"><span>فاکتور</span><span>${fmt(t.grandTotal)} تومان</span></div>`;
  if(prevBalFinal!==0){
    html += `<div class="r-row"><span>بدهی قبلی${prevBalFinal<0?' (بستانکار)':''}${refStr}</span><span>${fmt(Math.abs(prevBalFinal))} تومان</span></div>`;
  }
  html += `<div class="r-row"><span>پرداخت‌شده</span><span>${fmt(t.paid)} تومان</span></div>`;
  html += `<hr class="sep">`;
  html += finalRem >= 0
    ? `<div class="r-row bold accent"><span>مانده</span><span>${fmt(finalRem)} تومان</span></div>`
    : `<div class="r-row bold"><span>مانده (بستانکار مشتری)</span><span>${fmt(-finalRem)} تومان</span></div>`;
  return html;
}

function bindInvoiceListEvents(){
  bindBankInfoEvents();
  document.getElementById('newInvBtn')?.addEventListener('click', ()=>{ newInvoiceFromDraft(); render(); });
  const searchEl = document.getElementById('invSearchInput');
  if(searchEl){
    searchEl.addEventListener('input', e=>{
      const val = e.target.value;
      const pos = e.target.selectionStart;
      clearTimeout(invSearchDebounceTimer);
      invSearchDebounceTimer = setTimeout(()=>{
        invSearchQuery = val;
        invListVisibleCount = 30; // با تغییر جستجو، لیست از اول (۳۰ تای اول نتیجه‌ی جدید) نشون داده بشه
        render();
        const again = document.getElementById('invSearchInput');
        if(again){ again.focus(); again.setSelectionRange(pos,pos); }
      }, 150);
    });
  }
  document.getElementById('invLoadMoreBtn')?.addEventListener('click', ()=>{
    invListVisibleCount += 30;
    render();
  });
  document.getElementById('invClearQuickFilterBtn')?.addEventListener('click', ()=>{
    invQuickFilter = null;
    invListVisibleCount = 30;
    render();
  });
  document.querySelectorAll('.inv-edit').forEach(el=>{
    el.addEventListener('click', e=>{ loadInvoiceForEdit(e.currentTarget.dataset.id); render(); });
  });
  document.querySelectorAll('.inv-duplicate').forEach(el=>{
    el.addEventListener('click', e=>{ duplicateInvoice(e.currentTarget.dataset.id); render(); });
  });
  document.querySelectorAll('.inv-quick-settle').forEach(el=>{
    el.addEventListener('click', e=>{
      const id = e.currentTarget.dataset.id;
      const inv = invoices.find(i=>i.id===id);
      if(!inv) return;
      const t = computeInvoiceTotals(inv);
      if(t.balance<=0) return;
      if(!confirm('ثبت پرداخت کامل به مبلغ ' + fmt(t.balance) + ' تومان برای این فاکتور؟')) return;
      const payments = Array.isArray(inv.payments) ? [...inv.payments] : [];
      payments.push({ id:'quick-'+Date.now(), date: todayStr(), amount: t.balance, note:'ثبت سریع - پرداخت کامل' });
      const updated = {...inv, payments};
      updated.status = resolveInvoiceStatus(updated, updated.status);
      invoices = invoices.map(i=> i.id===id? updated : i);
      saveJSON(STORE_KEYS.invoices, invoices);
      render();
    });
  });
  document.querySelectorAll('.inv-delete').forEach(el=>{
    el.addEventListener('click', e=>{
      if(!confirm('این فاکتور حذف شود؟')) return;
      const id = e.currentTarget.dataset.id;
      const rowEl = e.currentTarget.closest('[data-row-id]');
      animateAndRemoveRow(rowEl, ()=>deleteInvoice(id));
    });
  });
  document.querySelectorAll('.inv-status[data-act="cycle"]').forEach(el=>{
    el.addEventListener('click', e=>{ cycleInvoiceStatusInList(e.currentTarget.dataset.id); });
  });
  document.querySelectorAll('.inv-jpg').forEach(el=>{
    el.addEventListener('click', e=>{
      const inv = invoices.find(i=>i.id===e.currentTarget.dataset.id);
      if(inv) exportInvoiceJPG(inv, e.currentTarget);
    });
  });
  document.querySelectorAll('.inv-share').forEach(el=>{
    el.addEventListener('click', e=>{
      const inv = invoices.find(i=>i.id===e.currentTarget.dataset.id);
      if(inv) shareInvoiceJPG(inv, e.currentTarget);
    });
  });
  document.querySelectorAll('.inv-print').forEach(el=>{
    el.addEventListener('click', e=>{
      const inv = invoices.find(i=>i.id===e.currentTarget.dataset.id);
      if(inv) printInvoice(inv);
    });
  });
}

// exportInvoiceJPG می‌تواند هم‌زمان چند بار صدا زده بشه (مثلا دوبار کلیک سریع، یا خروجی گرفتن از چند فاکتور پشت‌سرهم
// قبل از اتمام قبلی). قبلاً همه‌ی خروجی‌ها یک المنت مشترک (#invoiceRenderRoot) رو به اشتراک می‌ذاشتن و innerHTML
// اون رو بازنویسی می‌کردن؛ در نتیجه اگر یک export هنوز در حال گرفتن عکس (html2canvas) بود و export بعدی innerHTML
// رو عوض می‌کرد، خروجی یا خالی/اشتباه می‌شد یا اصلاً تولید نمی‌شد. حالا هر export یک container کاملاً مجزا و
// یک‌بارمصرف می‌سازه که با پایان کار همون export حذف می‌شه، پس چند export هم‌زمان با هم تداخل ندارن. همچنین دکمه‌ی
// مربوطه در حین export غیرفعال می‌شه تا از دوبار اجرا شدن با یک کلیک جلوگیری بشه، و خطاها دیگه بی‌صدا گم نمی‌شن.
let invoiceExportInFlight = new Set();
// رندر کردن فاکتور توی یک canvas مخفی (مشترک بین ذخیره‌ی JPG و اشتراک‌گذاری) — هر بار یک container
// کاملاً مجزا و یک‌بارمصرف می‌سازه تا خروجی‌گیری هم‌زمان چند فاکتور با هم تداخل نکنه
function renderInvoiceCanvas(inv){
  return new Promise((resolve, reject)=>{
    const root = document.createElement('div');
    root.style.position = 'fixed';
    root.style.left = '-9999px';
    root.style.top = '0';
    root.innerHTML = buildA4InvoiceHTML(inv);
    document.body.appendChild(root);
    const target = root.querySelector('.a4-wrap');
    html2canvas(target, {scale:3, useCORS:true, allowTaint:true, backgroundColor:'#ffffff', logging:false}).then(canvas=>{
      if(root.parentNode) root.parentNode.removeChild(root);
      resolve(canvas);
    }).catch(err=>{
      if(root.parentNode) root.parentNode.removeChild(root);
      reject(err);
    });
  });
}
function invoiceJpgFilename(inv){
  const custNameForFile = (inv.customerName||'بدون نام').trim().replace(/[\\/:*?"<>|]/g,'-');
  return 'LUMERASTEEL-' + custNameForFile + '-' + inv.number + '.jpg';
}
function exportInvoiceJPG(inv, triggerBtn){
  if(invoiceExportInFlight.has(inv.id)) return; // جلوگیری از اجرای هم‌زمان دوباره برای همون فاکتور (مثلا دابل کلیک)
  invoiceExportInFlight.add(inv.id);
  if(triggerBtn){ triggerBtn.disabled = true; triggerBtn.style.opacity = '0.6'; }
  const cleanup = ()=>{
    invoiceExportInFlight.delete(inv.id);
    if(triggerBtn){ triggerBtn.disabled = false; triggerBtn.style.opacity = ''; }
  };
  renderInvoiceCanvas(inv).then(canvas=>{
    canvas.toBlob(blob=>{
      if(!blob){ alert('خروجی گرفتن از فاکتور با خطا مواجه شد، دوباره تلاش کن'); cleanup(); return; }
      saveBlobSmart(blob, invoiceJpgFilename(inv)).then(()=>cleanup()).catch(()=>{
        alert('ذخیره فایل خروجی فاکتور با خطا مواجه شد');
        cleanup();
      });
    }, 'image/jpeg', 0.97);
  }).catch(()=>{
    alert('گرفتن خروجی عکس فاکتور با خطا مواجه شد، دوباره تلاش کن');
    cleanup();
  });
}
// اشتراک‌گذاری فاکتور از طریق منوی «اشتراک‌گذاری» خودِ گوشی/سیستم‌عامل — کاربر خودش تصمیم می‌گیره با کدوم
// برنامه (واتساپ، تلگرام، ایمیل، بلوتوث و...) بفرسته، به‌جای این‌که یک برنامه‌ی خاص از قبل انتخاب شده باشه
function shareInvoiceJPG(inv, triggerBtn){
  if(invoiceExportInFlight.has(inv.id)) return;
  invoiceExportInFlight.add(inv.id);
  if(triggerBtn){ triggerBtn.disabled = true; triggerBtn.style.opacity = '0.6'; }
  const cleanup = ()=>{
    invoiceExportInFlight.delete(inv.id);
    if(triggerBtn){ triggerBtn.disabled = false; triggerBtn.style.opacity = ''; }
  };
  renderInvoiceCanvas(inv).then(canvas=>{
    canvas.toBlob(blob=>{
      if(!blob){ alert('ساخت خروجی فاکتور با خطا مواجه شد، دوباره تلاش کن'); cleanup(); return; }
      const filename = invoiceJpgFilename(inv);
      const file = new File([blob], filename, {type:'image/jpeg'});
      const shareData = { files:[file], title: 'فاکتور #' + invNumStr(inv.number) };
      if(navigator.canShare && navigator.canShare(shareData)){
        navigator.share(shareData).then(cleanup).catch(err=>{
          cleanup();
          if(err && err.name==='AbortError') return; // کاربر خودش از منوی اشتراک‌گذاری انصراف داده — نیازی به پیام خطا نیست
          alert('اشتراک‌گذاری انجام نشد، می‌تونی از دکمه‌ی «خروجی JPG» به‌جاش استفاده کنی');
        });
      } else {
        cleanup();
        alert('این مرورگر از اشتراک‌گذاری مستقیم پشتیبانی نمی‌کنه. از دکمه‌ی «خروجی JPG» استفاده کن و خودت از توی گالری با هر برنامه‌ای که خواستی بفرست.');
      }
    }, 'image/jpeg', 0.97);
  }).catch(()=>{
    alert('گرفتن خروجی عکس فاکتور با خطا مواجه شد، دوباره تلاش کن');
    cleanup();
  });
}

  document.querySelectorAll('.mat-stock-add').forEach(el=>{

      materials = materials.map(m=> m.id===id? {...m, stockQty: String((parseFloat(m.stockQty)||0) + amount)} : m);

// ===== تب مشتریان =====
let custView = 'list'; // 'list' | 'detail' | 'new'
let activeCustomerId = null;
let custNewDraft = { name:'', phone:'' };
let custCreditDraft = { amount:'', date: todayStr(), note:'' };

function blankCustomer(){ return { id: Date.now().toString(), name:'', phone:'' }; }

// شماره فاکتورهای دیگر همین مشتری که هنوز مانده یا اضافه‌پرداخت دارند (برای ارجاع در فاکتور و لیست)
function customerOpenInvoices(customerId, excludeInvId){
  if(!customerId) return [];
  return invoices
    .filter(i=> i.customerId===customerId && i.id!==excludeInvId && (i.status==='final'||i.status==='paid'))
    .map(i=>{ const t = computeInvoiceTotals(i); return {number:i.number, balance:t.balance, overpaid:t.overpaid}; })
    .filter(x=> x.balance>0 || x.overpaid>0);
}
function customerBalance(customerId){
  // بدهکاری = جمع مانده فاکتورهای صادرشده/تسویه‌شده متصل به این مشتری
  // بستانکاری = جمع واریزی‌های آزاد ثبت‌شده + جمع اضافه‌پرداخت‌های فاکتورها (پولی که مشتری بیشتر از فاکتور داده)
  const linkedInvoices = invoices.filter(i=>i.customerId===customerId && i.status!=='draft' && i.status!=='cancelled');
  // قبلاً computeInvoiceTotals برای هر فاکتور دوبار صدا زده می‌شد (یک بار برای debit، یک بار برای overpaidTotal)؛
  // یک‌بار محاسبه و استفاده مجدد، هزینه‌ی این تابع رو نصف می‌کنه — روی لیست فاکتورهای بلند محسوسه
  let debit = 0, overpaidTotal = 0;
  linkedInvoices.forEach(inv=>{
    const t = computeInvoiceTotals(inv);
    debit += t.balance;
    overpaidTotal += t.overpaid;
  });
  const credit = transactions.filter(t=>t.customerId===customerId && t.type==='credit').reduce((s,t)=>s+(parseFloat(t.amount)||0),0) + overpaidTotal;
  return { debit, credit, net: credit - debit }; // net>0 یعنی بستانکار، net<0 یعنی بدهکار
}
// نسخه‌ی حافظه‌دارِ customerBalance، فقط برای یک اجرای رندر (مثلاً یک بار renderInvoiceListTab) —
// وقتی چند فاکتور مال یک مشتری هستن، به‌جای اسکن دوباره‌ی کل آرایه‌ی invoices برای هرکدوم، یک بار حساب می‌شه
function customerBalanceMemoized(cache){
  return (customerId)=>{
    if(cache.has(customerId)) return cache.get(customerId);
    const v = customerBalance(customerId);
    cache.set(customerId, v);
    return v;
  };
}
// قدیمی‌ترین تاریخ یک فاکتور صادرشده/تسویه‌شده که هنوز مانده‌ی پرداخت‌نشده داره — برای این‌که بشه گفت
// «این بدهی از چند روز پیش مونده»، نه فقط این‌که «بدهکاره» بدون هیچ سابقه‌ی زمانی
function customerOldestUnpaidDate(customerId){
  const unpaid = invoices.filter(i=> i.customerId===customerId && i.status!=='draft' && i.status!=='cancelled' && computeInvoiceTotals(i).balance>0);
  if(unpaid.length===0) return null;
  return unpaid.reduce((min,i)=> (!min || i.date<min) ? i.date : min, null);
}

function supplierBalance(supplierId){

function getCombinedBalances(){
  const rows = [];
  customers.forEach(c=>{
    const bal = customerBalance(c.id);
    let status, amount;
    if(bal.net<0){ status='debtor'; amount=Math.abs(bal.net); }
    else if(bal.net>0){ status='creditor'; amount=bal.net; }
    else { status='settled'; amount=0; }
    rows.push({ name:c.name, type:'مشتری', status, amount });
  });
  suppliers.forEach(s=>{
    const bal = supplierBalance(s.id);
    let status, amount;
    if(bal.debt>0){ status='creditor'; amount=bal.debt; }
    else { status='settled'; amount=0; }
    rows.push({ name:s.name, type:'تامین‌کننده', status, amount });
  });
  rows.sort((a,b)=>{
    if(a.status==='settled' && b.status!=='settled') return 1;
    if(a.status!=='settled' && b.status==='settled') return -1;
    return b.amount - a.amount;
  });
  return rows;
}

function expenseMonthSummary(){
  const monthStart = jalaliMonthStartISO();
  const todayS = todayStr();
  const inMonth = expenses.filter(e=> e.date>=monthStart && e.date<=todayS);
  // مقادیر منفی احتمالی (مثلا از بک‌آپ دستکاری‌شده) نادیده گرفته می‌شوند چون «هزینه منفی» بی‌معنی است
  const safeAmt = e => Math.max(0, parseFloat(e.amount)||0);
  const business = inMonth.filter(e=>e.tag==='business').reduce((s,e)=>s+safeAmt(e),0);
  const personal = inMonth.filter(e=>e.tag==='personal').reduce((s,e)=>s+safeAmt(e),0);
  const byCategory = {};
  inMonth.forEach(e=>{ byCategory[e.categoryName] = (byCategory[e.categoryName]||0) + safeAmt(e); });
  const topCategories = Object.entries(byCategory).sort((a,b)=>b[1]-a[1]);
  return { business, personal, total: business+personal, topCategories };
}

// پیشنهاد درصد سربار بر اساس میانگین چند ماه گذشته:
// برای هر ماه = (هزینه‌های کسب‌وکار همان ماه) ÷ (مجموع قیمت تمام‌شده رکوردهای تب محاسبه در همان ماه) × ۱۰۰
// فقط ماه‌هایی که هم هزینه و هم حداقل یک رکورد دارند حساب می‌شوند؛ ماه‌های ناقص نادیده گرفته می‌شوند تا میانگین را خراب نکنند
function suggestOverheadPercent(monthsBack){
  monthsBack = monthsBack || 3;
  const now = new Date();
  const monthRatios = [];
  for(let i=0;i<monthsBack;i++){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    const start = d.toISOString().slice(0,10);
    const endD = new Date(d.getFullYear(), d.getMonth()+1, 0);
    const end = endD.toISOString().slice(0,10);
    const exp = expenses.filter(e=> e.tag==='business' && e.date>=start && e.date<=end)
      .reduce((s,e)=>s+Math.max(0,parseFloat(e.amount)||0),0);
    const recCost = records.filter(r=> r.date>=start && r.date<=end)
      .reduce((s,r)=>s+Math.max(0,parseFloat(r.totalCost)||0),0);
    if(exp>0 && recCost>0) monthRatios.push(exp/recCost*100);
  }
  if(monthRatios.length===0) return null;
  const avg = monthRatios.reduce((s,v)=>s+v,0)/monthRatios.length;
  return { percent: Math.round(avg*10)/10, monthsUsed: monthRatios.length };
}
// سربار = درصد ثابت از قیمت تمام‌شده همین محصول (مواد+دستمزد) — مستقل از تعداد فروش این ماه
function computeAutoOverhead(){
  const materialsCost = calc.items.reduce((s,it)=>{
    const mat = materials.find(m=>m.id===it.materialId);
    const qty = parseQty(it.qty);
    return s + (mat? mat.price*qty : 0);
  },0);
  const laborCost = calc.laborItems.reduce((s,l)=>s+laborItemCost(l),0);
  const baseCost = Math.max(0, materialsCost + laborCost);
  // درصد سربار هرگز منفی نیست — منفی شدن سربار یعنی کاهش قیمت تمام‌شده که بی‌معنی است
  const pct = Math.max(0, parseFloat(overheadPercent)||0);
  const perUnit = baseCost * (pct/100);
  return { baseCost, percent: pct, perUnit };
}

        <div class="row-flex" style="margin-bottom:8px">
          ${renderJalaliDateInput('purchDate', purchaseDraft.date, 'flex:1')}
          <input id="purchNote" placeholder="توضیح (مثلا نوع ورق)" value="${escapeAttr(purchaseDraft.note)}" style="flex:1">
        </div>
        <button id="purchSaveBtn" class="btn btn-black" style="width:100%">ثبت خرید</button>
      </div>

      <div style="margin-top:16px;font-weight:700;font-size:13px">تاریخچه خریدها</div>
      ${list.length===0? '<p class="empty">خریدی ثبت نشده</p>' : list.map(p=>{
        const debt = Math.max(0,(parseFloat(p.amount)||0)-(parseFloat(p.paid)||0));
        return `<div class="card" data-row-id="${p.id}" style="margin-top:8px">
          <div class="card-title"><span>${fmt(p.amount)} تومان</span>
            <button class="btn-icon purch-delete" data-id="${p.id}">×</button>
          </div>
          <div class="card-sub">${jalaliStr(p.date)} ${p.note? '— '+escapeAttr(p.note):''}</div>
          <div style="margin-top:4px;font-weight:700;color:${debt>0?'var(--red)':'#1A7A3A'}">
            ${debt>0? 'بدهی: '+fmt(debt)+' ت' : 'تسویه‌شده'}
          </div>
        </div>`;
      }).join('')}
    `;
  }
  // لیست تامین‌کنندگان
  if(suppliers.length===0){
    return `<p class="empty">هنوز تامین‌کننده‌ای ثبت نشده</p>
    <button id="suppNewBtn" class="btn btn-red" style="width:100%">+ تامین‌کننده جدید</button>`;
  }
  return `
    <button id="suppNewBtn" class="btn btn-red" style="width:100%;margin-bottom:10px">+ تامین‌کننده جدید</button>
    ${suppliers.map(s=>{
      const bal = supplierBalance(s.id);
      return `<div class="card supp-row" data-id="${s.id}" style="cursor:pointer">
        <div class="card-title"><span>${escapeAttr(s.name)}</span></div>
        ${s.phone? `<div class="card-sub">${escapeAttr(s.phone)}</div>`:''}
        <div style="margin-top:6px;font-weight:700;color:${bal.debt>0?'var(--red)':'#1A7A3A'}">
          ${bal.debt>0? 'بدهی: '+fmt(bal.debt)+' ت' : 'تسویه'}
        </div>
      </div>`;
    }).join('')}
  `;
}

function bindSuppliersEvents(){
  document.getElementById('suppNewBtn')?.addEventListener('click', ()=>{ suppNewDraft={name:'',phone:''}; suppView='new'; render(); });
  document.getElementById('suppBackBtn')?.addEventListener('click', ()=>{ suppView='list'; activeSupplierId=null; render(); });
  document.getElementById('suppNameInput')?.addEventListener('input', e=>{ suppNewDraft.name = e.target.value; });
  document.getElementById('suppPhoneInput')?.addEventListener('input', e=>{ suppNewDraft.phone = e.target.value; });
  document.getElementById('suppSaveBtn')?.addEventListener('click', ()=>{
    if(!suppNewDraft.name.trim()){ alert('نام تامین‌کننده را وارد کنید'); return; }
    const s = blankSupplier();
    s.name = suppNewDraft.name.trim();
    s.phone = suppNewDraft.phone.trim();
    suppliers = [...suppliers, s];
    saveJSON(STORE_KEYS.suppliers, suppliers);
    suppView = 'list';
    render();
  });
  document.querySelectorAll('.supp-row').forEach(el=>{
    el.addEventListener('click', e=>{
      activeSupplierId = e.currentTarget.dataset.id;
      suppView = 'detail';
      purchaseDraft = { amount:'', paid:'', date: todayStr(), note:'' };
      render();
    });
  });
  document.getElementById('purchAmount')?.addEventListener('input', e=>{ purchaseDraft.amount = e.target.value; });
  document.getElementById('purchPaid')?.addEventListener('input', e=>{ purchaseDraft.paid = e.target.value; });
  bindJalaliDateInput('purchDate', iso=>{ purchaseDraft.date = iso; });
  document.getElementById('purchNote')?.addEventListener('input', e=>{ purchaseDraft.note = e.target.value; });
  document.getElementById('purchSaveBtn')?.addEventListener('click', ()=>{
    const amt = parseFloat(purchaseDraft.amount);
    if(!amt || amt<=0){ alert('مبلغ خرید را درست وارد کنید'); return; }
    const paid = parseFloat(purchaseDraft.paid)||0;
    purchases = [...purchases, {
      id: Date.now().toString()+Math.random().toString(36).slice(2),
      supplierId: activeSupplierId,
      amount: amt,
      paid: paid,
      date: purchaseDraft.date || todayStr(),
      note: purchaseDraft.note.trim()
    }];
    saveJSON(STORE_KEYS.purchases, purchases);
    purchaseDraft = { amount:'', paid:'', date: todayStr(), note:'' };
    render();
  });
  document.querySelectorAll('.purch-delete').forEach(el=>{
    el.addEventListener('click', e=>{
      e.stopPropagation();
      const id = e.currentTarget.dataset.id;
      if(!confirm('این خرید حذف شود؟')) return;
      const rowEl = e.currentTarget.closest('[data-row-id]');
      animateAndRemoveRow(rowEl, ()=>{
        purchases = purchases.filter(p=>p.id!==id);
        saveJSON(STORE_KEYS.purchases, purchases);
        render();
      });
    });
  });
}

    e.categoryName.toLowerCase().includes(q.toLowerCase()) || (e.note||'').toLowerCase().includes(q.toLowerCase())
  );
  const filtered = expFilterTag==='all'? searched : searched.filter(e=>e.tag===expFilterTag);

  return `
    <input id="expSearchInput" placeholder="جستجو بر اساس نام یا یادداشت..." value="${escapeAttr(expSearchQuery)}" style="margin-bottom:8px">

let chequeDraft = { direction:'receivable', amount:'', dueDate: todayStr(), personName:'', chequeNumber:'', bankName:'', note:'' };
let editingChequeId = null;
let chequeFilterStatus = 'pending'; // pending | cashed | bounced | all
const CHEQUE_STATUS_LABELS = { pending:'در انتظار', cashed:'نقد شده', bounced:'برگشت خورده' };
function renderChequesTab(){
  const pendingReceivable = cheques.filter(c=>c.direction==='receivable' && c.status==='pending').reduce((s,c)=>s+(parseFloat(c.amount)||0),0);
  const pendingPayable = cheques.filter(c=>c.direction==='payable' && c.status==='pending').reduce((s,c)=>s+(parseFloat(c.amount)||0),0);
  const todayS = todayStr();
  const filtered = cheques.filter(c=> chequeFilterStatus==='all' || c.status===chequeFilterStatus)
    .sort((a,b)=> (a.dueDate||'').localeCompare(b.dueDate||''));
  return `

let reportPeriod = 'month'; // week | month | q3 | q6 | year
let reportStartDate = todayStr();

function periodRange(period, refDateStr){
  // بازه از گذشته تا تاریخ مرجع (پیش‌فرض امروز) محاسبه می‌شود، نه برعکس
  const end = new Date(refDateStr || reportStartDate);
  let start;
  if(period==='week'){
    start = new Date(end);
    start.setDate(start.getDate()-7);
  } else {
    // برای ماهانه/سه‌ماهه/شش‌ماهه/سالانه، از ابتدای همان ماهِ N ماه قبل شروع می‌شود
    const monthsBack = period==='month'?1 : period==='q3'?3 : period==='q6'?6 : period==='year'?12 : 1;
    start = new Date(end.getFullYear(), end.getMonth()-monthsBack, 1);
  }
  return { start: start.toISOString().slice(0,10), end: end.toISOString().slice(0,10) };
}

// درآمد نهایی (بعد از تخفیف) این فاکتور رو بر اساس سهم هر فضای کاری از جمع ردیف‌ها تقسیم می‌کنه —
// برای فاکتورهای تک‌نوع همون مبلغ کامل به همون نوع می‌ره؛ برای چند‌نوع، تخفیف به نسبت بین‌شون پخش می‌شه
function invoiceRevenueByActivity(inv){
  const t = computeInvoiceTotals(inv);
  const result = {lumera:0, drafting:0, graphic:0};
  const scale = t.linesTotal>0 ? (t.grandTotal / t.linesTotal) : 0;
  inv.lines.forEach(l=>{
    const type = l.activityType || inv.activityType || 'lumera';
    const lineRevenue = invLineUnitPrice(l)*parseQty(l.qty);
    if(result[type]===undefined) result[type]=0;
    result[type] += lineRevenue*scale;
  });
  return result;
}
function reportData(period){
  const {start, end} = periodRange(period);
  const counted = invoices.filter(inv=> (inv.status==='final' || inv.status==='paid') && inv.date>=start && inv.date<=end);
  let lumera = 0, drafting = 0, graphic = 0, grossProfit = 0;
  counted.forEach(inv=>{
    const r = invoiceRevenueByActivity(inv);
    lumera += r.lumera; drafting += r.drafting; graphic += r.graphic;
    grossProfit += computeInvoiceTotals(inv).profitAfterDiscount;
  });
  // فقط هزینه‌های «کسب‌وکار» از سود کم می‌شن، نه هزینه‌های شخصی — چون هزینه شخصی ربطی به سودآوری کار نداره
  const businessExpenses = expenses.filter(e=> e.tag==='business' && e.date>=start && e.date<=end)
    .reduce((s,e)=>s+(parseFloat(e.amount)||0), 0);
  const netProfit = grossProfit - businessExpenses;
  return { lumera, drafting, graphic, total: lumera+drafting+graphic, count: counted.length, start, end, grossProfit, businessExpenses, netProfit };
}

const REPORT_PERIOD_LABELS = { week:'هفتگی', month:'ماهانه', q3:'سه‌ماهه', q6:'شش‌ماهه', year:'سالانه' };

function customerReportData(){
  return customers.map(c=>{
    const counted = invoices.filter(i=> i.customerId===c.id && (i.status==='final' || i.status==='paid'));
    const totalPurchase = counted.reduce((s,inv)=> s + computeInvoiceTotals(inv).grandTotal, 0);
    const bal = customerBalance(c.id);
    return { id:c.id, name:c.name, totalPurchase, invoiceCount: counted.length, debtRemaining: bal.net<0? Math.abs(bal.net) : 0, creditRemaining: bal.net>0? bal.net : 0 };
  }).sort((a,b)=> b.totalPurchase - a.totalPurchase);
}

/* ---------- REMINDERS ---------- */
// نزدیک‌ترین تاریخ سررسید آینده برای یک «روز ثابت ماهانه» (مثلا همیشه روز ۵) را برمی‌گرداند
// اگر آن روز در همین ماه هنوز نگذشته باشد همین ماه، وگرنه ماه بعد
function nextDueDateForDay(day){
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth(), todayDate = now.getDate();
  let targetMonth = m, targetYear = y;
  if(day < todayDate){ targetMonth = m+1; }
  const lastDayOfTargetMonth = new Date(targetYear, targetMonth+1, 0).getDate();
  const safeDay = Math.min(day, lastDayOfTargetMonth); // برای ماه‌هایی که آن روز را ندارند (مثلا ۳۱ در بهمن)
  const d = new Date(targetYear, targetMonth, safeDay);
  return d.toISOString().slice(0,10);
}
function getAllReminders(){
  const list = [];
  invoices.forEach(inv=>{
    if(inv.status==='cancelled') return;
    const custName = inv.customerName || 'بدون نام';
    if(inv.deliveryDueDate && inv.projectStatus!=='delivered'){
      list.push({ id:'deliv-'+inv.id, date: inv.deliveryDueDate, type:'تحویل', text:`موعد تحویل فاکتور #${inv.number||'-'} — ${custName}`, invoiceId: inv.id, source:'auto', done:false });
    }
    if(inv.validTo && inv.status==='final'){
      list.push({ id:'valid-'+inv.id, date: inv.validTo, type:'اعتبار', text:`پایان اعتبار فاکتور #${inv.number||'-'} — ${custName}`, invoiceId: inv.id, source:'auto', done:false });
    }
  });
  expenseCategories.forEach(c=>{
    if(!c.dueDay) return;
    const dueDate = nextDueDateForDay(c.dueDay);
    list.push({ id:'expcat-'+c.id, date: dueDate, type:'هزینه ثابت', text:`سررسید ${c.name}${c.defaultAmount? ' — '+fmt(c.defaultAmount)+' ت':''}`, invoiceId:null, source:'auto', done:false });
  });
  // بدهی معوق مشتری — اگه یه مشتری بیش از ۳۰ روزه یه فاکتور پرداخت‌نشده داره، یادآوری پیگیری خودکار ساخته می‌شه؛
  // چون این زنده از روی مانده‌حساب حساب می‌شه، به‌محض تسویه شدن بدهی، خودش از لیست یادآوری‌ها محو می‌شه
  const todayS0 = todayStr();
  customers.forEach(c=>{
    const bal = customerBalance(c.id);
    if(bal.net>=0) return; // فقط مشتری‌های بدهکار
    const oldestDate = customerOldestUnpaidDate(c.id);
    if(!oldestDate) return;
    const daysPast = Math.floor((new Date(todayS0) - new Date(oldestDate)) / 86400000);
    if(daysPast>=30){
      list.push({ id:'debt-'+c.id, date: oldestDate, type:'بدهی معوق', text:`${c.name} — ${toPersianDigits(daysPast)} روزه بدهکاره (${fmt(Math.abs(bal.net))} ت) — پیگیری کن`, invoiceId:null, source:'auto', done:false });
    }
  });
  // بدهی معوق ما به تامین‌کننده — همون منطق برعکس؛ این‌بار خودمون بدهکاریم، نه مشتری
  suppliers.forEach(s=>{
    const bal = supplierBalance(s.id);
    if(bal.debt<=0) return;
    const oldestDate = supplierOldestUnpaidDate(s.id);
    if(!oldestDate) return;
    const daysPast = Math.floor((new Date(todayS0) - new Date(oldestDate)) / 86400000);
    if(daysPast>=30){
      list.push({ id:'suppdebt-'+s.id, date: oldestDate, type:'بدهی به تامین‌کننده', text:`${toPersianDigits(daysPast)} روزه به ${s.name} بدهکاریم (${fmt(bal.debt)} ت)`, invoiceId:null, source:'auto', done:false });
    }
  });
  // کمبود موجودی مواد اولیه — فقط برای موادی که خودت آستانه‌ی هشدار براشون تعیین کردی (تا برای موادی که
  // اصلاً موجودیشون رو دنبال نمی‌کنی، شلوغ و بی‌مورد هشدار نده)
  materials.forEach(m=>{
    const threshold = parseFloat(m.lowStockThreshold)||0;
    if(threshold<=0) return;
    const stock = parseFloat(m.stockQty)||0;
    if(stock<=threshold){
      list.push({ id:'lowstock-'+m.id, date: todayS0, type:'کمبود موجودی', text:`موجودی ${m.name} کم شده — ${toPersianDigits(stock)} ${m.unit} مونده`, invoiceId:null, source:'auto', done:false });
    }
  });
  // سررسید چک‌های در انتظار — هم دریافتی هم پرداختی؛ مثل بقیه یادآورهای خودکار، با تاریخ سررسیدِ خودِ چک ثبت
  // می‌شه و فیلتر «۷ روز آینده» طبیعتاً نشونش می‌ده یا مخفی نگهش می‌داره
  cheques.forEach(c=>{
    if(c.status!=='pending') return;
    const dirLabel = c.direction==='receivable' ? 'دریافتی' : 'پرداختی';
    list.push({ id:'cheque-'+c.id, date: c.dueDate, type:'سررسید چک', text:`چک ${dirLabel} ${c.personName||''} — ${fmt(c.amount)} ت`, invoiceId:null, source:'auto', done:false });
  });
  manualReminders.forEach(r=>{
    if(r.done) return;
    list.push({ id:r.id, date:r.date, type:'یادآوری', text:r.text, invoiceId: r.invoiceId||null, source:'manual', done:false });
  });
  return list.sort((a,b)=> a.date.localeCompare(b.date));
}

function saveManualReminders(){ saveJSON(STORE_KEYS.reminders, manualReminders); }

function addManualReminder(date, text, invoiceId){
  if(!date || !text.trim()) return;
  manualReminders = [...manualReminders, { id: Date.now().toString()+Math.random().toString(36).slice(2), date, text: text.trim(), invoiceId: invoiceId||null, done:false }];
  saveManualReminders();
}
function deleteManualReminder(id){
  manualReminders = manualReminders.filter(r=>r.id!==id);
  saveManualReminders();
}

    else custCredit += bal.net;

  const monthStart = jalaliMonthStartISO();

}

function reportBarChart(bars){
  // bars: [{label, value, color}]
  const max = Math.max(...bars.map(b=>b.value), 1);
  const barW = 60, gap = 34, h = 140;
  const w = bars.length*barW + (bars.length+1)*gap;
  const startX = gap;
  const barsSvg = bars.map((b,i)=>{
    const x = startX + i*(barW+gap);
    const bh = Math.round((b.value/max)*100);
    return `
    <rect x="${x}" y="${h-20-bh}" width="${barW}" height="${bh}" fill="${b.color}" rx="3"/>
    <text x="${x+barW/2}" y="${h-20-bh-6}" text-anchor="middle" font-size="10" fill="#000" font-weight="700">${fmt(b.value)}</text>
    <text x="${x+barW/2}" y="${h-4}" text-anchor="middle" font-size="10" fill="#6B7075">${b.label}</text>`;
  }).join('');
  return `
  <svg viewBox="0 0 ${w} ${h}" style="width:100%;max-width:360px;display:block;margin:10px auto">
    <line x1="10" y1="${h-20}" x2="${w-10}" y2="${h-20}" stroke="#ddd" stroke-width="1"/>
    ${barsSvg}
  </svg>`;
}

// و بعد callback (که splice+render واقعیه) صدا زده می‌شه — تا حذف ردیف به‌جای پرش ناگهانی، نرم به‌نظر بیاد
function animateAndRemoveRow(el, onDone){
  if(!el){ onDone(); return; }
  let done = false;
  const finish = ()=>{ if(done) return; done = true; onDone(); };
  el.classList.add('row-removing');
  el.addEventListener('transitionend', finish, {once:true});
  setTimeout(finish, 220); // اگه transitionend به هر دلیلی شلیک نشد (مثلا prefers-reduced-motion)، خودش انجام بشه
}
